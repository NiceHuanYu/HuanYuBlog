<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="从顺序图导出的类图成品：左上是工程师参与者，指向申请界面边界类；申请界面指向配件控制器控制类；控制器向下连着库存项实体类与工单实体类，向右连着供应商接口边界类与出库单实体类。关系用带箭头的依赖线表示调用方向。右侧列出三条分析模型的关系限制：boundary 不直连 entity、actor 只接触 boundary、不同构造型之间不做继承聚合组合"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="clbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="depArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#4b6f9c" stroke-width="1.4" />
    </marker>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#clbg)" />
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">Figure 5: Request Parts —— 类图</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#5a6f8c">全部用依赖线，因为这是分析模型：只表达「谁调用谁」，不表达生命周期</text>

  <!-- Engineer actor -->
  <circle cx="100" cy="160" r="8" fill="#ffffff" stroke="#33507f" stroke-width="1.9" />
  <line x1="100" y1="168" x2="100" y2="192" stroke="#33507f" stroke-width="1.9" />
  <line x1="82" y1="176" x2="118" y2="176" stroke="#33507f" stroke-width="1.9" />
  <line x1="100" y1="192" x2="88" y2="210" stroke="#33507f" stroke-width="1.9" />
  <line x1="100" y1="192" x2="112" y2="210" stroke="#33507f" stroke-width="1.9" />
  <text x="100" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">Engineer</text>
  <text x="100" y="246" text-anchor="middle" font-size="8.5" fill="#8b9bb0">actor</text>

  <!-- 边界：PartsForm -->
  <rect x="190" y="140" width="150" height="56" rx="4" fill="#eef5fc" stroke="#7093c8" stroke-width="1.5" />
  <text x="265" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1f3a63">PartsForm</text>
  <text x="265" y="182" text-anchor="middle" font-size="9" fill="#4a7fb5">«boundary»</text>
  <line x1="128" y1="176" x2="186" y2="170" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 控制：PartsController -->
  <rect x="400" y="140" width="160" height="56" rx="4" fill="#eef5fc" stroke="#7093c8" stroke-width="1.5" />
  <text x="480" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1f3a63">PartsController</text>
  <text x="480" y="182" text-anchor="middle" font-size="9" fill="#4a7fb5">«control»</text>
  <line x1="342" y1="168" x2="396" y2="168" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 实体：StockItem -->
  <rect x="418" y="272" width="126" height="56" rx="4" fill="#fdf7ef" stroke="#c79a6d" stroke-width="1.5" />
  <text x="481" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a1e">StockItem</text>
  <text x="481" y="314" text-anchor="middle" font-size="9" fill="#8a5c30">«entity»</text>
  <line x1="470" y1="198" x2="474" y2="268" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 实体：WorkOrder -->
  <rect x="418" y="372" width="126" height="56" rx="4" fill="#fdf7ef" stroke="#c79a6d" stroke-width="1.5" />
  <text x="481" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a1e">WorkOrder</text>
  <text x="481" y="414" text-anchor="middle" font-size="9" fill="#8a5c30">«entity»</text>
  <line x1="446" y1="198" x2="460" y2="368" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 实体：IssueNote -->
  <rect x="620" y="272" width="126" height="56" rx="4" fill="#fdf7ef" stroke="#c79a6d" stroke-width="1.5" />
  <text x="683" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#7a4a1e">IssueNote</text>
  <text x="683" y="314" text-anchor="middle" font-size="9" fill="#8a5c30">«entity»</text>
  <line x1="520" y1="198" x2="660" y2="268" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 外部边界：SupplierAPI -->
  <rect x="620" y="140" width="150" height="56" rx="4" fill="#eef5fc" stroke="#7093c8" stroke-width="1.5" />
  <text x="695" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#1f3a63">SupplierAPI</text>
  <text x="695" y="182" text-anchor="middle" font-size="9" fill="#4a7fb5">«boundary» 外部</text>
  <line x1="562" y1="160" x2="616" y2="160" stroke="#4b6f9c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#depArrow)" />

  <!-- 说明：关系限制 -->
  <rect x="60" y="458" width="380" height="136" rx="8" fill="#ffffff" stroke="#d3deea" />
  <text x="76" y="480" font-size="11.5" font-weight="700" fill="#33507f">分析模型的三条关系限制</text>
  <text x="76" y="504" font-size="10" fill="#8a4b4b">✗ boundary 直接关联 entity</text>
  <text x="90" y="520" font-size="9" fill="#5a6f8c">中间应隔着 control —— 本例 PartsController 就承担这个角色</text>
  <text x="76" y="544" font-size="10" fill="#8a4b4b">✗ actor 与 entity / control 直接关联</text>
  <text x="90" y="560" font-size="9" fill="#5a6f8c">actor 只接触 boundary（Engineer → PartsForm 是唯一合法的）</text>
  <text x="76" y="584" font-size="10" fill="#8a4b4b">✗ 不同构造型之间做继承 / 聚合 / 组合</text>
  <text x="90" y="598" font-size="9" fill="#5a6f8c">这些关系只在同类构造型内部使用</text>

  <!-- 说明：导出规则 -->
  <rect x="460" y="458" width="396" height="136" rx="8" fill="#eef5fc" stroke="#7093c8" />
  <text x="476" y="480" font-size="11.5" font-weight="700" fill="#33507f">导出规则是机械的</text>
  <text x="476" y="504" font-size="10" fill="#41556f">顺序图里每个参与对象 → 一个类</text>
  <text x="476" y="526" font-size="10" fill="#41556f">对象收到的消息 → 该类的一个操作</text>
  <text x="476" y="548" font-size="10" fill="#41556f">谁调用谁 → 类之间的关系</text>
  <text x="476" y="574" font-size="10" fill="#8a4b4b">题目写「不要求定义属性和方法」就别写</text>
  <text x="476" y="590" font-size="9" fill="#5a6f8c">省下的时间用来检查箭头方向</text>

  <text x="60" y="640" font-size="10" fill="#8b9bb0">注：分析模型只画「谁调用谁」，所以全部是依赖线。等到设计建模阶段（笔记 23）才会补上关联、聚合、组合这些带生命周期含义的关系。</text>
</svg>
