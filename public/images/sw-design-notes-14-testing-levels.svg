<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="测试层级金字塔与两类测试方法：从下到上是单元测试、集成测试、系统测试、验收测试、部署测试，越往上覆盖范围越大、发现问题代价越高，每一层都配了派单宝案例中的具体例子；下方左侧对比白盒与黑盒测试的分工，右侧用数量字段 1 到 20 演示等价类划分与边界值分析，给出 0、1、12、20、21 五个取值及期望结果"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="tstbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="tstArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5743a" />
    </marker>
  </defs>

  <rect width="900" height="660" rx="16" fill="url(#tstbg)" />
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">测试层级与选输入的方法</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#5a6f8c">越往上覆盖越广、发现问题越贵；所以要「下宽上窄」</text>

  <!-- 金字塔（左侧） -->
  <text x="40" y="92" font-size="12.5" font-weight="700" fill="#33507f">五个层级：越往上越贵</text>

  <polygon points="150,110 330,110 310,148 170,148" fill="#fdf2f2" stroke="#e0b4b4" />
  <text x="240" y="134" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a4b4b">部署测试</text>

  <polygon points="170,152 310,152 290,190 190,190" fill="#fdf7ef" stroke="#d2a074" />
  <text x="240" y="176" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9a5f2a">验收测试 UAT</text>

  <polygon points="190,194 290,194 270,232 210,232" fill="#eef5fc" stroke="#7093c8" />
  <text x="240" y="217" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33507f">系统测试</text>

  <polygon points="210,236 270,236 254,274 226,274" fill="#eef5fc" stroke="#7093c8" />
  <text x="240" y="259" text-anchor="middle" font-size="9" font-weight="700" fill="#33507f">集成</text>

  <polygon points="226,278 254,278 242,316 238,316" fill="#eef7f3" stroke="#6fa894" />
  <text x="240" y="302" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2f6b58">单元</text>

  <!-- 右侧说明列表，与金字塔同高 -->
  <text x="330" y="126" font-size="9" fill="#41556f">真实环境能否安装运行</text>
  <text x="330" y="172" font-size="9" fill="#41556f">小林真能用它派完一天 80 单吗</text>
  <text x="330" y="204" font-size="9" fill="#41556f">300 人同时在线、派单成功率高不高</text>
  <text x="330" y="256" font-size="9" fill="#41556f">库存扣减与出库单是否同一事务</text>
  <text x="330" y="298" font-size="9" fill="#41556f">PartUsage 金额算得对不对</text>

  <!-- 连线 -->
  <line x1="332" y1="128" x2="348" y2="124" stroke="#c4d4e7" stroke-width="1" />
  <line x1="312" y1="170" x2="348" y2="168" stroke="#c4d4e7" stroke-width="1" />
  <line x1="292" y1="212" x2="348" y2="200" stroke="#c4d4e7" stroke-width="1" />
  <line x1="272" y1="256" x2="348" y2="252" stroke="#c4d4e7" stroke-width="1" />
  <line x1="256" y1="296" x2="348" y2="294" stroke="#c4d4e7" stroke-width="1" />

  <line x1="130" y1="316" x2="130" y2="106" stroke="#b5743a" stroke-width="1.6" marker-end="url(#tstArrow)" />
  <text x="112" y="196" font-size="8" fill="#b5743a">代价</text>
  <text x="112" y="210" font-size="8" fill="#b5743a">递增</text>

  <text x="40" y="342" font-size="9.5" fill="#8a4b4b">缺陷总在 UAT 才暴露 → 说明底层测试做得太少</text>

  <!-- 白盒 vs 黑盒 -->
  <rect x="40" y="360" width="410" height="150" rx="10" fill="#ffffff" stroke="#b9c8dd" />
  <text x="56" y="382" font-size="12" font-weight="700" fill="#33507f">两种方法：白盒看逻辑，黑盒看行为</text>

  <text x="56" y="406" font-size="9.5" font-weight="700" fill="#1f3a63">白盒 white box</text>
  <text x="56" y="422" font-size="9" fill="#41556f">「库存充足 / 不足」两个分支都走到了吗</text>
  <text x="56" y="438" font-size="9" fill="#41556f">异常处理有代码覆盖吗</text>

  <text x="56" y="462" font-size="9.5" font-weight="700" fill="#1f3a63">黑盒 black box</text>
  <text x="56" y="478" font-size="9" fill="#41556f">数量填 0 / 21 / 5，结果对不对</text>
  <text x="56" y="494" font-size="9" fill="#41556f">不关心代码怎么写的，业务方也能参与</text>

  <text x="56" y="516" font-size="9" fill="#8b9bb0">共同局限：都只能覆盖到你想到的情况</text>

  <!-- 等价类与边界值 -->
  <rect x="470" y="360" width="400" height="150" rx="10" fill="#ffffff" stroke="#7fb89f" />
  <text x="486" y="382" font-size="12" font-weight="700" fill="#2f6b58">等价类 + 边界值：数量字段 1–20</text>

  <rect x="486" y="392" width="368" height="22" fill="#e3f2ea" stroke="#7fb89f" />
  <text x="496" y="408" font-size="8.5" font-weight="700" fill="#2f6b58">无效类：&lt; 1</text>
  <text x="600" y="408" font-size="8.5" font-weight="700" fill="#2f6b58">有效类：1 – 20</text>
  <text x="760" y="408" font-size="8.5" font-weight="700" fill="#2f6b58">无效类：&gt; 20</text>

  <!-- 取值点 -->
  <circle cx="520" cy="440" r="9" fill="#fdf2f2" stroke="#8a4b4b" stroke-width="1.5" />
  <text x="520" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#8a4b4b">0</text>
  <text x="520" y="462" text-anchor="middle" font-size="7.5" fill="#8a4b4b">边界外</text>
  <text x="520" y="474" text-anchor="middle" font-size="7.5" fill="#8a4b4b">报错</text>

  <circle cx="586" cy="440" r="9" fill="#eef7f3" stroke="#2f6b58" stroke-width="1.5" />
  <text x="586" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#2f6b58">1</text>
  <text x="586" y="462" text-anchor="middle" font-size="7.5" fill="#2f6b58">下边界上</text>
  <text x="586" y="474" text-anchor="middle" font-size="7.5" fill="#2f6b58">通过</text>

  <circle cx="658" cy="440" r="9" fill="#eef7f3" stroke="#2f6b58" stroke-width="1.5" />
  <text x="658" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#2f6b58">12</text>
  <text x="658" y="462" text-anchor="middle" font-size="7.5" fill="#2f6b58">中间值</text>
  <text x="658" y="474" text-anchor="middle" font-size="7.5" fill="#2f6b58">通过</text>

  <circle cx="730" cy="440" r="9" fill="#eef7f3" stroke="#2f6b58" stroke-width="1.5" />
  <text x="730" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#2f6b58">20</text>
  <text x="730" y="462" text-anchor="middle" font-size="7.5" fill="#2f6b58">上边界上</text>
  <text x="730" y="474" text-anchor="middle" font-size="7.5" fill="#2f6b58">通过</text>

  <circle cx="802" cy="440" r="9" fill="#fdf2f2" stroke="#8a4b4b" stroke-width="1.5" />
  <text x="802" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#8a4b4b">21</text>
  <text x="802" y="462" text-anchor="middle" font-size="7.5" fill="#8a4b4b">边界外</text>
  <text x="802" y="474" text-anchor="middle" font-size="7.5" fill="#8a4b4b">报错</text>

  <!-- 底部 -->
  <rect x="40" y="530" width="830" height="56" rx="8" fill="#fdf2f2" stroke="#e0b4b4" />
  <text x="56" y="550" font-size="10.5" font-weight="700" fill="#8a4b4b">为什么测 21 不够，还要测 20</text>
  <text x="56" y="570" font-size="10" fill="#5a6f8c">「&gt; 20 报错」只证明了超上限会拦；「= 20 通过」才能证明「正好到上限」没被写成「&gt;= 20 报错」。这类错只在边界暴露。</text>

  <text x="40" y="608" font-size="10.5" fill="#8b9bb0">注：测「库存不足」分支时，测试数据必须真的造一个只剩 1 个的库存 —— 数据都充足的话，这条用例根本跑不到那个分支。</text>
  <text x="40" y="634" font-size="10.5" fill="#8a4b4b">一句话：测试的目的是发现缺陷，不是证明没有缺陷。测试通过只说明「这组输入下没出问题」。</text>
</svg>