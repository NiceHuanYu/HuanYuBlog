<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="测试层级的金字塔与两类测试方法：从下到上是单元测试、集成测试、系统测试、验收测试，越往上覆盖范围越大、发现问题代价越高；下方对比白盒测试与黑盒测试，以及黑盒测试选输入用的等价类划分"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#tlbg)" />
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">测试的五个层级与两类方法</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">越靠下的层级跑得越勤，越靠上的层级越贵</text>

  <rect x="120" y="390" width="480" height="56" rx="8" fill="#e7f1ea" stroke="#8bb39a" />
  <text x="360" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a63">单元测试</text>
  <text x="360" y="432" text-anchor="middle" font-size="10.5" fill="#5f7183">Unit Testing</text>

  <rect x="180" y="328" width="360" height="56" rx="8" fill="#e8f0f9" stroke="#9dbcd9" />
  <text x="360" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a63">集成测试</text>
  <text x="360" y="370" text-anchor="middle" font-size="10.5" fill="#5f7183">Integration Testing</text>

  <rect x="240" y="266" width="240" height="56" rx="8" fill="#dcebf9" stroke="#7093c8" />
  <text x="360" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3a63">系统测试</text>
  <text x="360" y="308" text-anchor="middle" font-size="10.5" fill="#5f7183">System Testing</text>

  <rect x="280" y="204" width="160" height="56" rx="8" fill="#33507f" />
  <text x="360" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">验收测试</text>
  <text x="360" y="246" text-anchor="middle" font-size="10.5" fill="#cedcee">UAT</text>

  <text x="650" y="230" font-size="12.5" font-weight="700" fill="#33507f">越往上：</text>
  <text x="650" y="256" font-size="11.5" fill="#5a6f8c">覆盖范围越大</text>
  <text x="650" y="280" font-size="11.5" fill="#5a6f8c">发现问题的代价越高</text>
  <text x="650" y="304" font-size="11.5" fill="#5a6f8c">需要参与的人越多</text>
  <text x="650" y="328" font-size="11.5" fill="#5a6f8c">越难自动化</text>
  <text x="650" y="356" font-size="11.5" fill="#8a4b4b">所以能往下压的缺陷，</text>
  <text x="650" y="376" font-size="11.5" fill="#8a4b4b">就别留到上层去发现</text>

  <rect x="40" y="470" width="400" height="130" rx="12" fill="#ffffff" opacity="0.9" stroke="#d3e0ee" />
  <text x="60" y="500" font-size="14" font-weight="700" fill="#33507f">白盒测试 vs 黑盒测试</text>
  <text x="60" y="528" font-size="11.5" fill="#41556f">白盒（white box）：看内部逻辑，覆盖分支与语句</text>
  <text x="60" y="552" font-size="11.5" fill="#41556f">黑盒（black box）：只看输入输出，不看实现</text>
  <text x="60" y="578" font-size="11.5" fill="#8a4b4b">共同局限：只能覆盖你想到的情况</text>

  <rect x="460" y="470" width="400" height="130" rx="12" fill="#eef5fc" stroke="#7093c8" />
  <text x="480" y="500" font-size="14" font-weight="700" fill="#1f3a63">等价类划分（equivalence class）</text>
  <text x="480" y="528" font-size="11.5" fill="#41556f">按值域：年龄 1–120，取 5 / 60 / 200 各一条</text>
  <text x="480" y="552" font-size="11.5" fill="#41556f">按输入个数：订单 0 行 / 1 行 / 500 行</text>
  <text x="480" y="578" font-size="11.5" fill="#41556f">按异常条件：空值、超长、非法字符、并发</text>
</svg>
