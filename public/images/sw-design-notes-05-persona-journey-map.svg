<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="用户画像与客户旅程图：上半部分是客服小林的用户画像五个要素，目标、行为、环境、痛点、限制，每栏都填了具体内容；下半部分是客户报修旅程的四个阶段，报修前、等待上门、上门中、上门后，每列列出客户在想什么、触点是什么，并用一条情绪折线标出起伏，其中等待上门阶段情绪最低且触点为空"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="pjbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="660" rx="16" fill="url(#pjbg)" />
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">用户画像与客户旅程图</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#5a6f8c">一个说清「他是谁」，一个说清「他经历了什么」</text>

  <!-- 上半：persona -->
  <text x="40" y="92" font-size="13" font-weight="700" fill="#33507f">① 用户画像：客服小林（主要画像）</text>

  <rect x="40" y="102" width="168" height="88" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="56" y="122" font-size="10.5" font-weight="700" fill="#33507f">目标 Goals</text>
  <text x="56" y="144" font-size="9.5" fill="#41556f">一天结束时</text>
  <text x="56" y="160" font-size="9.5" fill="#41556f">不留下未派的单</text>

  <rect x="222" y="102" width="200" height="88" rx="8" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.4" />
  <text x="238" y="122" font-size="10.5" font-weight="700" fill="#8a4b4b">行为 Behaviors（最该写具体）</text>
  <text x="238" y="144" font-size="9" fill="#8a4b4b">先记进 Excel 第 37 行</text>
  <text x="238" y="160" font-size="9" fill="#8a4b4b">再翻便签本逐个打电话问</text>
  <text x="238" y="176" font-size="9" fill="#8a4b4b">没接就记下，回头再打第二次</text>

  <rect x="436" y="102" width="180" height="88" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="452" y="122" font-size="10.5" font-weight="700" fill="#33507f">环境 Context</text>
  <text x="452" y="144" font-size="9.5" fill="#41556f">办公室，双屏</text>
  <text x="452" y="160" font-size="9.5" fill="#41556f">电话不断，常被打断</text>

  <rect x="630" y="102" width="230" height="88" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="646" y="122" font-size="10.5" font-weight="700" fill="#33507f">痛点 Pain Points</text>
  <text x="646" y="144" font-size="9.5" fill="#41556f">不知道谁有空</text>
  <text x="646" y="160" font-size="9.5" fill="#41556f">临时塞单打乱工程师路线</text>

  <rect x="40" y="202" width="360" height="46" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="56" y="222" font-size="10.5" font-weight="700" fill="#33507f">限制 Constraints</text>
  <text x="56" y="240" font-size="9.5" fill="#41556f">不能给工程师排太满；客户要求当天响应</text>

  <rect x="416" y="202" width="444" height="46" rx="8" fill="#fdf7ef" stroke="#d2a074" />
  <text x="432" y="222" font-size="10.5" font-weight="700" fill="#9a5f2a">次要画像与主要画像</text>
  <text x="432" y="240" font-size="9.5" fill="#7a4a1e">主要 = 客服小林（派单是她做的）；次要 = 客户（只看进度）、工程师（别排冲突）</text>

  <!-- 下半：journey map -->
  <text x="40" y="284" font-size="13" font-weight="700" fill="#33507f">② 客户旅程图：一次报修的四个阶段</text>

  <!-- 表头 -->
  <rect x="40" y="294" width="120" height="26" fill="#dce8f6" stroke="#b7c7dd" />
  <text x="100" y="311" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33507f">阶段</text>
  <rect x="160" y="294" width="170" height="26" fill="#dce8f6" stroke="#b7c7dd" />
  <text x="245" y="311" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33507f">报修前</text>
  <rect x="330" y="294" width="170" height="26" fill="#fde8e8" stroke="#b7c7dd" />
  <text x="415" y="311" text-anchor="middle" font-size="9.5" font-weight="700" fill="#8a4b4b">等待上门</text>
  <rect x="500" y="294" width="170" height="26" fill="#dce8f6" stroke="#b7c7dd" />
  <text x="585" y="311" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33507f">上门中</text>
  <rect x="670" y="294" width="160" height="26" fill="#dce8f6" stroke="#b7c7dd" />
  <text x="750" y="311" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33507f">上门后</text>

  <!-- 想什么 -->
  <rect x="40" y="320" width="120" height="74" fill="#f6f9fd" stroke="#b7c7dd" />
  <text x="100" y="362" text-anchor="middle" font-size="9.5" fill="#41556f">他在想什么</text>
  <rect x="160" y="320" width="170" height="74" fill="#ffffff" stroke="#b7c7dd" />
  <text x="172" y="342" font-size="9" fill="#41556f">「能不能今天来？」</text>
  <text x="172" y="358" font-size="9" fill="#41556f">「大概多少钱？」</text>
  <rect x="330" y="320" width="170" height="74" fill="#fdf6f6" stroke="#b7c7dd" />
  <text x="342" y="342" font-size="9" font-weight="700" fill="#8a4b4b">「到底几点到？」</text>
  <text x="342" y="358" font-size="9" font-weight="700" fill="#8a4b4b">「我要不要请假？」</text>
  <text x="342" y="376" font-size="8.5" fill="#8a4b4b">反复看手机</text>
  <rect x="500" y="320" width="170" height="74" fill="#ffffff" stroke="#b7c7dd" />
  <text x="512" y="342" font-size="9" fill="#41556f">「这个零件该换吗？」</text>
  <text x="512" y="358" font-size="9" fill="#41556f">「贵不贵？」</text>
  <rect x="670" y="320" width="160" height="74" fill="#ffffff" stroke="#b7c7dd" />
  <text x="682" y="342" font-size="9" fill="#41556f">「会不会又坏？」</text>
  <text x="682" y="358" font-size="9" fill="#41556f">「保修多久？」</text>

  <!-- 触点 -->
  <rect x="40" y="394" width="120" height="50" fill="#f6f9fd" stroke="#b7c7dd" />
  <text x="100" y="422" text-anchor="middle" font-size="9.5" fill="#41556f">触点</text>
  <rect x="160" y="394" width="170" height="50" fill="#ffffff" stroke="#b7c7dd" />
  <text x="172" y="416" font-size="9" fill="#41556f">电话 / 小程序</text>
  <rect x="330" y="394" width="170" height="50" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.4" />
  <text x="342" y="416" font-size="9.5" font-weight="700" fill="#8a4b4b">无 —— 信息真空</text>
  <text x="342" y="434" font-size="8.5" fill="#8a4b4b">这个环节根本不存在</text>
  <rect x="500" y="394" width="170" height="50" fill="#ffffff" stroke="#b7c7dd" />
  <text x="512" y="422" font-size="9" fill="#41556f">工程师本人</text>
  <rect x="670" y="394" width="160" height="50" fill="#ffffff" stroke="#b7c7dd" />
  <text x="682" y="422" font-size="9" fill="#41556f">纸质单 / 短信</text>

  <!-- 情绪曲线 -->
  <rect x="40" y="444" width="120" height="72" fill="#f6f9fd" stroke="#b7c7dd" />
  <text x="100" y="484" text-anchor="middle" font-size="9.5" fill="#41556f">情绪</text>
  <line x1="160" y1="456" x2="830" y2="456" stroke="#dfe7f1" stroke-width="1.2" stroke-dasharray="4 3" />
  <polyline points="245,472 415,508 585,470 750,462" fill="none" stroke="#b5743a" stroke-width="2.4" />
  <circle cx="245" cy="472" r="5" fill="#ffffff" stroke="#b5743a" stroke-width="2" />
  <circle cx="415" cy="508" r="6" fill="#d9534f" stroke="#8a4b4b" stroke-width="2" />
  <circle cx="585" cy="470" r="5" fill="#ffffff" stroke="#b5743a" stroke-width="2" />
  <circle cx="750" cy="462" r="5" fill="#ffffff" stroke="#b5743a" stroke-width="2" />
  <text x="415" y="530" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8a4b4b">最低点</text>

  <!-- 结论 -->
  <rect x="40" y="532" width="790" height="52" rx="8" fill="#fdf7ef" stroke="#d2a074" />
  <text x="56" y="552" font-size="10.5" font-weight="700" fill="#9a5f2a">旅程图直接给出需求：情绪最低的那一格，触点写的是「无」</text>
  <text x="56" y="572" font-size="10" fill="#7a4a1e">不是这个环节做得不好，而是它根本不存在 —— 所以需求是「补上进度可见性」，不是「优化等待体验」。</text>

  <text x="40" y="608" font-size="10.5" fill="#8b9bb0">注：这张旅程图的最后两列（各阶段的期望 + 由哪个用例回应），配上用例名，就是用例图的骨架（笔记 08）。</text>
  <text x="40" y="632" font-size="10.5" fill="#8a4b4b">「行为」那一栏写得越具体越好：Excel 第 37 行、便签本、打第二次电话 —— 每一条都能变成设计输入。</text>
</svg>