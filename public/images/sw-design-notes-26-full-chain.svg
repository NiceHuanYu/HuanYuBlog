<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="从需求到代码的完整链路：上半部分十个环节排成两行，每个环节标出它回答什么问题、留下什么产出、由谁验收，并注明对应笔记号；下半部分列出六条贯穿全系列的原则，每条都用派单宝案例给一个具体落点；底部给出两个最有用的自检问题"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="fcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="fcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7093c8" />
    </marker>
  </defs>

  <rect width="900" height="720" rx="16" fill="url(#fcbg)" />
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">整条链路：每一环都有自己的验收者</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#5a6f8c">某一环找不到验收者，那一环的产出大概率没人真正需要</text>

  <!-- 第一行五个环节 -->
  <rect x="34" y="84" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="109" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">事实调查</text>
  <text x="46" y="124" font-size="8" fill="#41556f">现在实际怎么运作</text>
  <text x="46" y="142" font-size="8" fill="#8a5c30">→ 访谈记录</text>
  <text x="46" y="160" font-size="8" fill="#8a4b4b">验收：团队内部</text>
  <text x="46" y="174" font-size="7.5" fill="#8b9bb0">笔记 04、13</text>

  <rect x="196" y="84" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="271" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">范围界定</text>
  <text x="208" y="124" font-size="8" fill="#41556f">做什么、不做什么</text>
  <text x="208" y="142" font-size="8" fill="#8a5c30">→ 范围清单 + 画像</text>
  <text x="208" y="160" font-size="8" fill="#2f6b58">验收：业务方</text>
  <text x="208" y="174" font-size="7.5" fill="#8b9bb0">笔记 05、06</text>

  <rect x="358" y="84" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="433" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">需求结构化</text>
  <text x="370" y="124" font-size="8" fill="#41556f">用户到底要什么</text>
  <text x="370" y="142" font-size="8" fill="#8a5c30">→ 用户故事 + 标准</text>
  <text x="370" y="160" font-size="8" fill="#2f6b58">验收：业务方 + 开发</text>
  <text x="370" y="174" font-size="7.5" fill="#8b9bb0">笔记 07</text>

  <rect x="520" y="84" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="595" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">功能建模</text>
  <text x="532" y="124" font-size="8" fill="#41556f">系统要做什么</text>
  <text x="532" y="142" font-size="8" fill="#8a5c30">→ 用例 + 活动图</text>
  <text x="532" y="160" font-size="8" fill="#2f6b58">验收：业务方</text>
  <text x="532" y="174" font-size="7.5" fill="#8b9bb0">笔记 08–11</text>

  <rect x="682" y="84" width="184" height="96" rx="8" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.4" />
  <text x="774" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a4b4b">界面设计</text>
  <text x="694" y="124" font-size="8" fill="#41556f">用户怎么操作</text>
  <text x="694" y="142" font-size="8" fill="#8a5c30">→ 线框图、屏幕流程</text>
  <text x="694" y="160" font-size="8" font-weight="700" fill="#8a4b4b">验收：小林（不是开发）</text>
  <text x="694" y="174" font-size="7.5" fill="#8b9bb0">笔记 12 · 这环差点没有验收者</text>

  <!-- 第二行五个环节 -->
  <rect x="34" y="192" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="109" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">质量属性</text>
  <text x="46" y="232" font-size="8" fill="#41556f">做得多好</text>
  <text x="46" y="250" font-size="8" fill="#8a5c30">→ NFR + 测试用例</text>
  <text x="46" y="268" font-size="8" fill="#2f6b58">验收：运维 + 测试</text>
  <text x="46" y="282" font-size="7.5" fill="#8b9bb0">笔记 14、15</text>

  <rect x="196" y="192" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="271" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">数据建模</text>
  <text x="208" y="232" font-size="8" fill="#41556f">数据怎么组织</text>
  <text x="208" y="250" font-size="8" fill="#8a5c30">→ ERD、3NF、LDM</text>
  <text x="208" y="268" font-size="8" fill="#2f6b58">验收：开发</text>
  <text x="208" y="282" font-size="7.5" fill="#8b9bb0">笔记 18、19</text>

  <rect x="358" y="192" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="433" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">对象建模</text>
  <text x="370" y="232" font-size="8" fill="#41556f">用对象怎么表达</text>
  <text x="370" y="250" font-size="8" fill="#8a5c30">→ 类图、顺序图</text>
  <text x="370" y="268" font-size="8" fill="#2f6b58">验收：开发</text>
  <text x="370" y="282" font-size="7.5" fill="#8b9bb0">笔记 20–22</text>

  <rect x="520" y="192" width="150" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="595" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">设计建模</text>
  <text x="532" y="232" font-size="8" fill="#41556f">怎么落到平台</text>
  <text x="532" y="250" font-size="8" fill="#8a5c30">→ 表、访问层、事务</text>
  <text x="532" y="268" font-size="8" fill="#2f6b58">验收：开发</text>
  <text x="532" y="174" font-size="0" fill="#000">.</text>
  <text x="532" y="282" font-size="7.5" fill="#8b9bb0">笔记 23</text>

  <rect x="682" y="192" width="184" height="96" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="774" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">代码与重构</text>
  <text x="694" y="232" font-size="8" fill="#41556f">结构怎么不烂</text>
  <text x="694" y="250" font-size="8" fill="#8a5c30">→ 可维护的代码</text>
  <text x="694" y="268" font-size="8" fill="#2f6b58">验收：团队</text>
  <text x="694" y="282" font-size="7.5" fill="#8b9bb0">笔记 24、25</text>

  <!-- 六条原则 -->
  <text x="34" y="320" font-size="12.5" font-weight="700" fill="#33507f">六条贯穿全系列的原则，每条都有本例的落点</text>

  <rect x="34" y="330" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="50" y="350" font-size="9.5" font-weight="700" fill="#1f3a63">① 需求要能被验证</text>
  <text x="50" y="368" font-size="8.5" fill="#41556f">「系统要快」不是需求</text>
  <text x="50" y="382" font-size="8.5" fill="#2f6b58">本例：早高峰查进度 95 分位 ≤ 2 秒</text>

  <rect x="456" y="330" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="472" y="350" font-size="9.5" font-weight="700" fill="#1f3a63">② 事实和假设必须分开记</text>
  <text x="472" y="368" font-size="8.5" fill="#41556f">「日均 80 通」是事实，「人力是瓶颈」是假设</text>
  <text x="472" y="382" font-size="8.5" fill="#8a4b4b">本例：后者被数据推翻了（瓶颈是排期不可见）</text>

  <rect x="34" y="398" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="50" y="418" font-size="9.5" font-weight="700" fill="#1f3a63">③ 能算出来的不要存</text>
  <text x="50" y="436" font-size="8.5" fill="#41556f">同一事实存在两处，必有不一致的那天</text>
  <text x="50" y="450" font-size="8.5" fill="#2f6b58">本例：缺料率、平均时长、完成率都不建字段</text>

  <rect x="456" y="398" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="472" y="418" font-size="9.5" font-weight="700" fill="#1f3a63">④ 行为跟着数据走</text>
  <text x="472" y="436" font-size="8.5" fill="#41556f">计算属于持有数据的对象，不属于工具类</text>
  <text x="472" y="450" font-size="8.5" fill="#2f6b58">本例：WorkOrder.canRequestParts()</text>

  <rect x="34" y="466" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="50" y="486" font-size="9.5" font-weight="700" fill="#1f3a63">⑤ 让变化集中</text>
  <text x="50" y="504" font-size="8.5" fill="#41556f">高内聚让改动集中，低耦合让改动不外溢</text>
  <text x="50" y="518" font-size="8.5" fill="#2f6b58">本例：新增保修单只需新增一个类</text>

  <rect x="456" y="466" width="410" height="60" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="472" y="486" font-size="9.5" font-weight="700" fill="#1f3a63">⑥ 没有测试的重构是赌博</text>
  <text x="472" y="504" font-size="8.5" fill="#41556f">行为不变只能靠测试保证</text>
  <text x="472" y="518" font-size="8.5" fill="#2f6b58">本例：重构 dispatch() 前先补五条测试</text>

  <!-- 两个自检问题 -->
  <rect x="34" y="542" width="832" height="84" rx="9" fill="#fdf7ef" stroke="#d2a074" stroke-width="1.4" />
  <text x="50" y="562" font-size="11" font-weight="700" fill="#9a5f2a">如果只记两个问题，记这两句</text>
  <text x="50" y="586" font-size="10.5" font-weight="700" fill="#8a4b4b">① 这个决定，如果三个月后被推翻，代价有多大？</text>
  <text x="410" y="586" font-size="9" fill="#7a4a1e">→ 算代价</text>
  <text x="50" y="610" font-size="10.5" font-weight="700" fill="#8a4b4b">② 这个决定，如果做错了，谁会先发现？</text>
  <text x="410" y="610" font-size="9" fill="#7a4a1e">→ 找验收者</text>

  <!-- 底部 -->
  <text x="34" y="650" font-size="10.5" fill="#41556f">第一个问题用来决定「要不要现在做」：本例「工程师能否属多个片区」若猜错要迁移几千条数据 → 现在问清。</text>
  <text x="34" y="672" font-size="10.5" fill="#41556f">第二个问题用来发现「有没有人在乎」：界面布局做错了第一个发现的是小林；表结构做错了第一个发现的是三个月后的开发 —— 那时太晚。</text>
  <text x="34" y="700" font-size="10" fill="#8a4b4b">还有一个容易被忽略的收尾：那些「只存在于代码里」的规则（本例「紧急单优先」）如果没有测试，对团队而言等于不存在 —— 下次重构就会丢掉。</text>
</svg>