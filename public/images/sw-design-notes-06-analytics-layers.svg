<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="分析的四个层次与业务目标的映射：四个层次从低到高是 descriptive 发生了什么、diagnostic 为什么发生、predictive 可能会发生什么、prescriptive 应该怎么做；下方给出三行业务目标到分析层次与所需数据的映射示例"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="albg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="alArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7093c8" />
    </marker>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#albg)" />
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">分析的四个层次：越往右，越接近决策</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">从「看见现象」到「给出决策」，需要的条件是不一样的</text>

  <rect x="55" y="310" width="175" height="76" rx="11" fill="#ffffff" stroke="#c4d4e7" />
  <text x="142" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a63">Descriptive</text>
  <text x="142" y="365" text-anchor="middle" font-size="11.5" fill="#5a6f8c">发生了什么</text>

  <rect x="260" y="258" width="175" height="76" rx="11" fill="#ffffff" stroke="#c4d4e7" />
  <text x="347" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a63">Diagnostic</text>
  <text x="347" y="313" text-anchor="middle" font-size="11.5" fill="#5a6f8c">为什么发生</text>

  <rect x="465" y="206" width="175" height="76" rx="11" fill="#ffffff" stroke="#c4d4e7" />
  <text x="552" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#1f3a63">Predictive</text>
  <text x="552" y="261" text-anchor="middle" font-size="11.5" fill="#5a6f8c">可能会发生什么</text>

  <rect x="670" y="154" width="175" height="76" rx="11" fill="#33507f" />
  <text x="757" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Prescriptive</text>
  <text x="757" y="209" text-anchor="middle" font-size="11.5" fill="#cedcee">应该怎么做</text>

  <line x1="232" y1="346" x2="256" y2="296" stroke="#7093c8" stroke-width="2" marker-end="url(#alArrow)" />
  <line x1="437" y1="294" x2="461" y2="244" stroke="#7093c8" stroke-width="2" marker-end="url(#alArrow)" />
  <line x1="642" y1="242" x2="666" y2="192" stroke="#7093c8" stroke-width="2" marker-end="url(#alArrow)" />

  <text x="450" y="404" text-anchor="middle" font-size="12" fill="#7b8ea8">↑ 越往右上，对数据质量与业务理解的要求越高</text>

  <rect x="40" y="432" width="820" height="166" rx="12" fill="#ffffff" opacity="0.85" stroke="#d3e0ee" />
  <text x="60" y="462" font-size="14" font-weight="700" fill="#33507f">业务目标 → 分析层次 → 所需数据</text>
  <text x="60" y="494" font-size="12" fill="#41556f">提升复购率 → Descriptive + Diagnostic → 复购间隔、流失前的行为轨迹</text>
  <text x="60" y="522" font-size="12" fill="#41556f">预测旺季人力 → Predictive → 历史成交量、节假日、天气记录</text>
  <text x="60" y="550" font-size="12" fill="#41556f">决定先改哪个环节 → Prescriptive → 各环节的流失人数与补救成本</text>
  <text x="60" y="580" font-size="11.5" fill="#8a4b4b">先想清楚目标，再去挑分析手段；反过来做，只会得到一堆没人用的报表。</text>
</svg>
