<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="从需求到图纸的推导链：用例图确定系统边界与角色，活动图把用例展开成带泳道的流程，业务实体从流程中提取后挂回活动图，顺序图再把流程摊到边界、控制、实体三类对象上，类图从顺序图机械导出，最后界面草图把流程映射到屏幕"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="chbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="chainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7093c8" />
    </marker>
  </defs>

  <rect width="900" height="580" rx="16" fill="url(#chbg)" />
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">六张图是逐层细化，不是六种并列画法</text>
  <text x="450" y="68" text-anchor="middle" font-size="13.5" fill="#5a6f8c">每一层的输入来自上一层 —— 卡住的时候，问题通常出在上一张图</text>

  <!-- ① 用例图 -->
  <rect x="40" y="92" width="390" height="120" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="58" y="116" font-size="12.5" font-weight="700" fill="#33507f">① 用例图 · 谁在用、系统做什么</text>
  <rect x="58" y="130" width="150" height="62" rx="8" fill="#eef5fc" stroke="#7093c8" stroke-dasharray="5 3" />
  <text x="133" y="146" text-anchor="middle" font-size="9.5" fill="#33507f">系统边界</text>
  <ellipse cx="133" cy="172" rx="56" ry="14" fill="#ffffff" stroke="#7093c8" />
  <text x="133" y="176" text-anchor="middle" font-size="9" fill="#1f3a63">Make Booking</text>
  <line x1="212" y1="166" x2="272" y2="160" stroke="#7093c8" stroke-width="1.4" />
  <circle cx="286" cy="148" r="6" fill="#ffffff" stroke="#33507f" stroke-width="1.6" />
  <line x1="286" y1="154" x2="286" y2="170" stroke="#33507f" stroke-width="1.6" />
  <line x1="276" y1="160" x2="296" y2="160" stroke="#33507f" stroke-width="1.6" />
  <line x1="286" y1="170" x2="279" y2="182" stroke="#33507f" stroke-width="1.6" />
  <line x1="286" y1="170" x2="293" y2="182" stroke="#33507f" stroke-width="1.6" />
  <text x="286" y="196" text-anchor="middle" font-size="8.5" fill="#1f3a63">Patient</text>
  <text x="322" y="146" font-size="9" fill="#5a6f8c">角色清单</text>
  <text x="322" y="162" font-size="9" fill="#5a6f8c">系统边界</text>
  <text x="322" y="178" font-size="9" fill="#5a6f8c">动宾命名</text>

  <!-- ② 活动图 -->
  <rect x="470" y="92" width="390" height="120" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="488" y="116" font-size="12.5" font-weight="700" fill="#33507f">② 活动图 · 流程怎么走</text>
  <rect x="488" y="130" width="112" height="62" rx="8" fill="#eef5fc" stroke="#7093c8" opacity="0.55" />
  <rect x="606" y="130" width="112" height="62" rx="8" fill="#eef5fc" stroke="#7093c8" opacity="0.55" />
  <rect x="724" y="130" width="118" height="62" rx="8" fill="#eef5fc" stroke="#7093c8" opacity="0.55" />
  <text x="544" y="148" text-anchor="middle" font-size="9" fill="#33507f">患者</text>
  <text x="662" y="148" text-anchor="middle" font-size="9" fill="#33507f">协调员</text>
  <text x="783" y="148" text-anchor="middle" font-size="9" fill="#33507f">医疗团队</text>
  <rect x="500" y="156" width="88" height="22" rx="11" fill="#ffffff" stroke="#7093c8" />
  <text x="544" y="171" text-anchor="middle" font-size="8.5" fill="#1f3a63">Request Visit</text>
  <rect x="618" y="156" width="88" height="22" rx="11" fill="#ffffff" stroke="#7093c8" />
  <text x="662" y="171" text-anchor="middle" font-size="8.5" fill="#1f3a63">Check Slot</text>
  <rect x="739" y="156" width="88" height="22" rx="11" fill="#ffffff" stroke="#7093c8" />
  <text x="783" y="171" text-anchor="middle" font-size="8.5" fill="#1f3a63">Confirm</text>
  <text x="488" y="206" font-size="9" fill="#5a6f8c">泳道 = 谁做 · 菱形 = 分支 · 粗线 = 并行</text>

  <!-- ③ 业务实体 -->
  <rect x="40" y="248" width="240" height="120" rx="12" fill="#fdf7ef" stroke="#d2a074" />
  <text x="58" y="272" font-size="12.5" font-weight="700" fill="#9a5f2a">③ 业务实体 · 要长期记住什么</text>
  <rect x="58" y="284" width="96" height="24" rx="4" fill="#ffffff" stroke="#c79a6d" />
  <text x="106" y="300" text-anchor="middle" font-size="9" fill="#7a4a1e">Booking Record</text>
  <rect x="164" y="284" width="96" height="24" rx="4" fill="#ffffff" stroke="#c79a6d" />
  <text x="212" y="300" text-anchor="middle" font-size="9" fill="#7a4a1e">Patient Profile</text>
  <rect x="58" y="316" width="96" height="24" rx="4" fill="#ffffff" stroke="#c79a6d" />
  <text x="106" y="332" text-anchor="middle" font-size="9" fill="#7a4a1e">Team Roster</text>
  <text x="58" y="358" font-size="9" fill="#8a5c30">不是动作 · 要长期记住 · 有多个实例</text>

  <!-- ④ 顺序图 -->
  <rect x="320" y="248" width="540" height="120" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="338" y="272" font-size="12.5" font-weight="700" fill="#33507f">④ 顺序图 · 哪些对象按什么顺序协作</text>
  <rect x="344" y="284" width="58" height="20" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="373" y="298" text-anchor="middle" font-size="8" fill="#1f3a63">:Patient</text>
  <rect x="456" y="284" width="80" height="20" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="496" y="298" text-anchor="middle" font-size="8" fill="#1f3a63">:BookingForm</text>
  <rect x="584" y="284" width="80" height="20" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="624" y="298" text-anchor="middle" font-size="8" fill="#1f3a63">:BookingCtrl</text>
  <rect x="716" y="284" width="68" height="20" rx="3" fill="#fdf7ef" stroke="#c79a6d" />
  <text x="750" y="298" text-anchor="middle" font-size="8" fill="#7a4a1e">:Booking</text>
  <line x1="373" y1="306" x2="373" y2="352" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="496" y1="306" x2="496" y2="352" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="624" y1="306" x2="624" y2="352" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="750" y1="306" x2="750" y2="352" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="374" y1="316" x2="494" y2="316" stroke="#4b6f9c" stroke-width="1.3" marker-end="url(#chainArrow)" />
  <text x="434" y="312" text-anchor="middle" font-size="7.5" fill="#41556f">1: submit()</text>
  <line x1="497" y1="330" x2="622" y2="330" stroke="#4b6f9c" stroke-width="1.3" marker-end="url(#chainArrow)" />
  <text x="560" y="326" text-anchor="middle" font-size="7.5" fill="#41556f">2: requestBooking()</text>
  <line x1="625" y1="344" x2="748" y2="344" stroke="#4b6f9c" stroke-width="1.3" marker-end="url(#chainArrow)" />
  <text x="686" y="340" text-anchor="middle" font-size="7.5" fill="#41556f">3: create()</text>
  <text x="338" y="360" font-size="9" fill="#5a6f8c">四种生命线 actor / boundary / control / entity，消息编号对齐 basic flow</text>

  <!-- ⑤ 类图 -->
  <rect x="320" y="392" width="250" height="122" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="338" y="416" font-size="12.5" font-weight="700" fill="#33507f">⑤ 类图 · 有哪些类、什么关系</text>
  <rect x="338" y="428" width="76" height="24" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="376" y="444" text-anchor="middle" font-size="8.5" fill="#1f3a63">BookingForm</text>
  <rect x="462" y="428" width="76" height="24" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="500" y="444" text-anchor="middle" font-size="8.5" fill="#1f3a63">BookingCtrl</text>
  <rect x="462" y="466" width="76" height="24" rx="3" fill="#fdf7ef" stroke="#c79a6d" />
  <text x="500" y="482" text-anchor="middle" font-size="8.5" fill="#7a4a1e">Booking</text>
  <line x1="414" y1="440" x2="460" y2="440" stroke="#4b6f9c" stroke-width="1.3" marker-end="url(#chainArrow)" />
  <line x1="500" y1="452" x2="500" y2="464" stroke="#4b6f9c" stroke-width="1.3" marker-end="url(#chainArrow)" />
  <text x="338" y="504" font-size="9" fill="#5a6f8c">收到的消息 → 类的操作；谁调用谁 → 类的关系</text>

  <!-- ⑥ 界面草图 -->
  <rect x="606" y="392" width="254" height="122" rx="12" fill="#eef7f3" stroke="#6fa894" />
  <text x="624" y="416" font-size="12.5" font-weight="700" fill="#2f6b58">⑥ 界面草图 · 落到屏幕上</text>
  <rect x="624" y="426" width="218" height="52" rx="4" fill="#ffffff" stroke="#6fa894" />
  <line x1="624" y1="442" x2="842" y2="442" stroke="#cbe4db" stroke-width="1.2" />
  <text x="632" y="438" font-size="8.5" fill="#2f6b58">周历（隐喻：排期）</text>
  <text x="632" y="458" font-size="8" fill="#5a6f8c">时段 ┃ 预约 ┃ 紧急度</text>
  <text x="632" y="472" font-size="8" fill="#5a6f8c">一屏一个主结构，标出隐喻</text>
  <text x="624" y="496" font-size="9" fill="#2f6b58">活动图的每一步 → 一个屏幕或一次操作</text>

  <!-- 层间箭头与说明 -->
  <line x1="432" y1="152" x2="466" y2="152" stroke="#7093c8" stroke-width="1.8" marker-end="url(#chainArrow)" />
  <text x="449" y="144" text-anchor="middle" font-size="9" fill="#5a6f8c">细化</text>

  <line x1="160" y1="214" x2="160" y2="244" stroke="#7093c8" stroke-width="1.8" marker-end="url(#chainArrow)" />
  <text x="172" y="234" font-size="9" fill="#5a6f8c">从流程里圈名词</text>

  <line x1="282" y1="308" x2="316" y2="308" stroke="#7093c8" stroke-width="1.8" marker-end="url(#chainArrow)" />
  <text x="299" y="300" text-anchor="middle" font-size="9" fill="#5a6f8c">挂回</text>

  <line x1="590" y1="370" x2="590" y2="388" stroke="#7093c8" stroke-width="1.8" marker-end="url(#chainArrow)" />
  <text x="602" y="384" font-size="9" fill="#5a6f8c">机械导出</text>

  <line x1="572" y1="452" x2="602" y2="452" stroke="#7093c8" stroke-width="1.8" marker-end="url(#chainArrow)" />
  <text x="587" y="444" text-anchor="middle" font-size="9" fill="#5a6f8c">映射</text>

  <!-- 底部 -->
  <line x1="40" y1="536" x2="860" y2="536" stroke="#d3deea" stroke-width="1.4" />
  <text x="40" y="560" font-size="11.5" fill="#8a4b4b">卡住的位置就是漏掉的那一层：抽不出实体，通常是活动图的步骤写得太粗；画不出顺序图，通常是 basic flow 没读透。</text>
</svg>
