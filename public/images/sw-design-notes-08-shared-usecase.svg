<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" role="img" aria-label="两个参与者连到同一个用例的三种画法对照：第一种是一条用例连两条实线，两个火柴人各拉一条线到同一个椭圆，适用两人触发与执行方式完全一致的情况；第二种是参与者泛化，抽象的父角色挂公共用例，子角色只挂差异用例，空心三角由子指向父；第三种是拆成两个用例，两个椭圆各连各的参与者，适用两人用法不同。中部给出判据，底部列出两个反例"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="subg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="740" rx="16" fill="url(#subg)" />
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">两个参与者共用同一个用例：三种画法</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#5a6f8c">判据不是「两人都会用到」，而是「两人触发并执行的方式是否一致」</text>

  <!-- ===== 画法一 ===== -->
  <rect x="28" y="84" width="276" height="286" rx="10" fill="#ffffff" stroke="#2f6b58" stroke-width="1.6" />
  <rect x="28" y="84" width="276" height="26" rx="10" fill="#eef7f3" stroke="#2f6b58" stroke-width="1.6" />
  <text x="166" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f6b58">① 一条用例 + 两条线　★ 首选</text>

  <rect x="96" y="122" width="190" height="148" rx="6" fill="none" stroke="#33507f" stroke-dasharray="6 4" />
  <text x="191" y="140" text-anchor="middle" font-size="8" fill="#33507f">派单宝系统</text>
  <ellipse cx="191" cy="200" rx="62" ry="17" fill="#eef5fc" stroke="#7093c8" />
  <text x="191" y="204" text-anchor="middle" font-size="8" fill="#1f3a63">View Dispatch Board</text>

  <circle cx="58" cy="164" r="6" fill="#ffffff" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="170" x2="58" y2="188" stroke="#33507f" stroke-width="1.6" />
  <line x1="46" y1="176" x2="70" y2="176" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="188" x2="50" y2="202" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="188" x2="66" y2="202" stroke="#33507f" stroke-width="1.6" />
  <text x="58" y="218" text-anchor="middle" font-size="7.5" fill="#1f3a63">Clerk</text>
  <line x1="70" y1="180" x2="131" y2="192" stroke="#7093c8" stroke-width="1.4" />

  <circle cx="58" cy="248" r="6" fill="#ffffff" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="254" x2="58" y2="272" stroke="#33507f" stroke-width="1.6" />
  <line x1="46" y1="260" x2="70" y2="260" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="272" x2="50" y2="286" stroke="#33507f" stroke-width="1.6" />
  <line x1="58" y1="272" x2="66" y2="286" stroke="#33507f" stroke-width="1.6" />
  <text x="58" y="302" text-anchor="middle" font-size="7.5" fill="#1f3a63">Manager</text>
  <line x1="70" y1="252" x2="131" y2="207" stroke="#7093c8" stroke-width="1.4" />

  <text x="166" y="292" text-anchor="middle" font-size="8" fill="#41556f">两条都是实线、不带箭头</text>
  <line x1="44" y1="304" x2="288" y2="304" stroke="#e8eef6" stroke-width="1" />
  <text x="44" y="322" font-size="8.5" font-weight="700" fill="#2f6b58">适用：只在这一个用例上用法一致</text>
  <text x="44" y="340" font-size="8" fill="#41556f">本例：客服与片区经理「看待派单」一样</text>
  <text x="44" y="356" font-size="8" fill="#8b9bb0">两人点进去看到同一个界面、同一套步骤</text>

  <!-- ===== 画法二 ===== -->
  <rect x="316" y="84" width="276" height="286" rx="10" fill="#ffffff" stroke="#7093c8" stroke-width="1.5" />
  <rect x="316" y="84" width="276" height="26" rx="10" fill="#eef5fc" stroke="#7093c8" stroke-width="1.5" />
  <text x="454" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33507f">② 参与者泛化</text>

  <rect x="384" y="122" width="192" height="148" rx="6" fill="none" stroke="#33507f" stroke-dasharray="6 4" />
  <text x="480" y="140" text-anchor="middle" font-size="8" fill="#33507f">派单宝系统</text>
  <ellipse cx="512" cy="166" rx="52" ry="13" fill="#eef5fc" stroke="#7093c8" />
  <text x="512" y="170" text-anchor="middle" font-size="7.5" fill="#1f3a63">View Board</text>
  <ellipse cx="512" cy="198" rx="52" ry="13" fill="#eef5fc" stroke="#7093c8" />
  <text x="512" y="202" text-anchor="middle" font-size="7.5" fill="#1f3a63">Reschedule</text>
  <ellipse cx="512" cy="244" rx="52" ry="13" fill="#fdf7ef" stroke="#c79a6d" />
  <text x="512" y="248" text-anchor="middle" font-size="7.5" fill="#7a4a1e">View Report</text>

  <!-- 父角色在左下，名字放在左侧空白 -->
  <circle cx="336" cy="150" r="6" fill="#ffffff" stroke="#2f6b58" stroke-width="1.7" />
  <line x1="336" y1="156" x2="336" y2="174" stroke="#2f6b58" stroke-width="1.7" />
  <line x1="324" y1="162" x2="348" y2="162" stroke="#2f6b58" stroke-width="1.7" />
  <line x1="336" y1="174" x2="328" y2="188" stroke="#2f6b58" stroke-width="1.7" />
  <line x1="336" y1="174" x2="344" y2="188" stroke="#2f6b58" stroke-width="1.7" />
  <text x="352" y="150" font-size="7.5" font-weight="700" fill="#2f6b58">StoreStaff</text>
  <text x="352" y="162" font-size="6.5" fill="#8b9bb0">«abstract»</text>
  <line x1="348" y1="160" x2="458" y2="166" stroke="#7093c8" stroke-width="1.3" />
  <line x1="348" y1="170" x2="458" y2="198" stroke="#7093c8" stroke-width="1.3" />

  <!-- 子角色 -->
  <circle cx="336" cy="238" r="5" fill="#ffffff" stroke="#33507f" stroke-width="1.5" />
  <line x1="336" y1="243" x2="336" y2="257" stroke="#33507f" stroke-width="1.5" />
  <line x1="327" y1="248" x2="345" y2="248" stroke="#33507f" stroke-width="1.5" />
  <line x1="336" y1="257" x2="330" y2="268" stroke="#33507f" stroke-width="1.5" />
  <line x1="336" y1="257" x2="342" y2="268" stroke="#33507f" stroke-width="1.5" />
  <text x="336" y="282" text-anchor="middle" font-size="7" fill="#1f3a63">Clerk</text>
  <line x1="338" y1="226" x2="332" y2="192" stroke="#2f6b58" stroke-width="1.1" />
  <path d="M 326 200 L 332 188 L 340 199 z" fill="#ffffff" stroke="#2f6b58" stroke-width="1.1" />

  <circle cx="404" cy="238" r="5" fill="#ffffff" stroke="#33507f" stroke-width="1.5" />
  <line x1="404" y1="243" x2="404" y2="257" stroke="#33507f" stroke-width="1.5" />
  <line x1="395" y1="248" x2="413" y2="248" stroke="#33507f" stroke-width="1.5" />
  <line x1="404" y1="257" x2="398" y2="268" stroke="#33507f" stroke-width="1.5" />
  <line x1="404" y1="257" x2="410" y2="268" stroke="#33507f" stroke-width="1.5" />
  <text x="404" y="282" text-anchor="middle" font-size="7" fill="#1f3a63">Manager</text>
  <line x1="396" y1="226" x2="352" y2="192" stroke="#2f6b58" stroke-width="1.1" />
  <line x1="412" y1="236" x2="458" y2="244" stroke="#b5743a" stroke-width="1.1" stroke-dasharray="4 3" />

  <line x1="332" y1="304" x2="576" y2="304" stroke="#e8eef6" stroke-width="1" />
  <text x="332" y="322" font-size="8.5" font-weight="700" fill="#33507f">适用：共用一整批用例，只是权限不同</text>
  <text x="332" y="340" font-size="8" fill="#41556f">空心三角子→父；父角色挂公共用例</text>
  <text x="332" y="356" font-size="8" fill="#8a4b4a">橙色虚线 = Manager 独有，只有它连</text>

  <!-- ===== 画法三 ===== -->
  <rect x="604" y="84" width="268" height="286" rx="10" fill="#ffffff" stroke="#b9c8dd" stroke-width="1.5" />
  <rect x="604" y="84" width="268" height="26" rx="10" fill="#fdf7ef" stroke="#d2a074" stroke-width="1.5" />
  <text x="738" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a5f2a">③ 拆成两个用例</text>

  <rect x="676" y="122" width="184" height="148" rx="6" fill="none" stroke="#33507f" stroke-dasharray="6 4" />
  <text x="768" y="140" text-anchor="middle" font-size="8" fill="#33507f">派单宝系统</text>
  <ellipse cx="790" cy="176" rx="60" ry="15" fill="#eef5fc" stroke="#7093c8" />
  <text x="790" y="180" text-anchor="middle" font-size="7.5" fill="#1f3a63">Assign Engineer</text>
  <ellipse cx="790" cy="234" rx="60" ry="15" fill="#eef5fc" stroke="#7093c8" />
  <text x="790" y="238" text-anchor="middle" font-size="7.5" fill="#1f3a63">Accept Assignment</text>

  <circle cx="638" cy="164" r="6" fill="#ffffff" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="170" x2="638" y2="188" stroke="#33507f" stroke-width="1.6" />
  <line x1="626" y1="176" x2="650" y2="176" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="188" x2="630" y2="202" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="188" x2="646" y2="202" stroke="#33507f" stroke-width="1.6" />
  <text x="638" y="218" text-anchor="middle" font-size="7.5" fill="#1f3a63">Clerk</text>
  <line x1="650" y1="180" x2="728" y2="176" stroke="#7093c8" stroke-width="1.4" />

  <circle cx="638" cy="248" r="6" fill="#ffffff" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="254" x2="638" y2="272" stroke="#33507f" stroke-width="1.6" />
  <line x1="626" y1="260" x2="650" y2="260" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="272" x2="630" y2="286" stroke="#33507f" stroke-width="1.6" />
  <line x1="638" y1="272" x2="646" y2="286" stroke="#33507f" stroke-width="1.6" />
  <text x="638" y="302" text-anchor="middle" font-size="7.5" fill="#1f3a63">Engineer</text>
  <line x1="650" y1="252" x2="728" y2="234" stroke="#7093c8" stroke-width="1.4" />

  <line x1="620" y1="304" x2="856" y2="304" stroke="#e8eef6" stroke-width="1" />
  <text x="620" y="322" font-size="8.5" font-weight="700" fill="#8a4b4b">适用：两人用法不同</text>
  <text x="620" y="340" font-size="8" fill="#41556f">一个发起、一个响应，动作方向都不同</text>
  <text x="620" y="356" font-size="8" fill="#8b9bb0">名字听着像一个事，但不是一个用例</text>

  <!-- ===== 判据 ===== -->
  <rect x="28" y="386" width="844" height="72" rx="10" fill="#eef5fc" stroke="#7093c8" stroke-width="1.6" />
  <text x="46" y="408" font-size="11" font-weight="700" fill="#33507f">判据只有一句：这两个角色点进去之后，看到的是同一个界面、走的是同一套步骤吗？</text>
  <text x="46" y="430" font-size="9.5" fill="#2f6b58">是 → 一个用例连两根线（或做参与者泛化）　　不是 → 拆成两个用例，哪怕名字听起来像</text>
  <text x="46" y="448" font-size="8.5" fill="#8a4b4b">讲义原话：both will trigger and execute the use case in the same way —— 关键是 in the same way 这四个词</text>

  <!-- ===== 两个反例 ===== -->
  <rect x="28" y="472" width="410" height="116" rx="9" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.4" />
  <text x="44" y="492" font-size="10" font-weight="700" fill="#8a4b4b">反例一：把「都会用到」当成「用法一致」</text>
  <text x="44" y="514" font-size="8.5" fill="#5a6f8c">客服「派单」与工程师「接单」都跟派单有关，</text>
  <text x="44" y="530" font-size="8.5" fill="#5a6f8c">但一个发起、一个响应，动作方向都不同。</text>
  <text x="44" y="552" font-size="8.5" font-weight="700" fill="#2f6b58">→ 必须画成两个用例</text>
  <text x="44" y="570" font-size="8" fill="#8b9bb0">画成一个会让人以为两人在做同一件事</text>

  <rect x="462" y="472" width="410" height="116" rx="9" fill="#fdf7ef" stroke="#d2a074" stroke-width="1.4" />
  <text x="478" y="492" font-size="10" font-weight="700" fill="#9a5f2a">反例二：用「是不是同一批人」当判据</text>
  <text x="478" y="514" font-size="8.5" fill="#5a6f8c">讲义：「好的 actor = 唯一角色」。两组人扮演同一</text>
  <text x="478" y="530" font-size="8.5" fill="#5a6f8c">角色时可合并；但将来会访问不同用例时要分开。</text>
  <text x="478" y="552" font-size="8.5" font-weight="700" fill="#8a4b4b">→ 判据是用法，不是人群</text>
  <text x="478" y="570" font-size="8" fill="#8b9bb0">两个完全不同的角色，用法一致也能连同一个用例</text>

  <!-- ===== 底部 ===== -->
  <rect x="28" y="604" width="844" height="52" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="44" y="624" font-size="10" font-weight="700" fill="#33507f">怎么选：只共用一个用例 vs 共用一整批</text>
  <text x="44" y="644" font-size="9" fill="#41556f">只共用<text x="110" y="644" font-weight="700" fill="#2f6b58">一个</text>用例 → 直接连两根线（最省事）；共用<text x="360" y="644" font-weight="700" fill="#33507f">一整批</text>用例、只是权限不同 → 做参与者泛化（笔记 10 展开）。</text>

  <text x="28" y="680" font-size="10" fill="#8a4b4b">考场提醒：关联线一律画实线、不带箭头。带箭头只在「系统主动推送」（比如每日排期提醒）时才用 —— 那是另一回事。</text>
  <text x="28" y="706" font-size="9.5" fill="#8b9bb0">规则来源：讲义 06 Functional Requirement 的 page 14（共享用例）与 page 18（用法不同则拆开），两页正好是一对反向判断。</text>
</svg>