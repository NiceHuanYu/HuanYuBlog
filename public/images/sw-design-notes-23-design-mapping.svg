<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="对象模型到关系模型的映射规则与三种继承映射方案：类和属性分别映射为表与列，关联和聚合靠外键表达；继承可以映射成单表加类型列、每个具体类一张表、或每个类各一张表三种方案"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="dmbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#dmbg2)" />
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">从对象模型到关系模型</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">类和关系都有对应的落法，只有继承需要做选择</text>

  <rect x="40" y="104" width="820" height="36" fill="#33507f" />
  <text x="58" y="129" font-size="12.5" font-weight="700" fill="#ffffff">对象模型</text>
  <text x="300" y="129" font-size="12.5" font-weight="700" fill="#ffffff">关系模型</text>
  <text x="560" y="129" font-size="12.5" font-weight="700" fill="#ffffff">要注意的地方</text>

  <rect x="40" y="140" width="820" height="40" fill="#ffffff" opacity="0.85" />
  <text x="58" y="165" font-size="11.5" fill="#41556f">类（class）</text>
  <text x="300" y="165" font-size="11.5" fill="#41556f">表（table）</text>
  <text x="560" y="165" font-size="11.5" fill="#41556f">一个实体类对应一张表</text>

  <rect x="40" y="180" width="820" height="40" fill="#ffffff" opacity="0.6" />
  <text x="58" y="205" font-size="11.5" fill="#41556f">属性（attribute）</text>
  <text x="300" y="205" font-size="11.5" fill="#41556f">列（column）</text>
  <text x="560" y="205" font-size="11.5" fill="#41556f">类型与长度在这一步定下来</text>

  <rect x="40" y="220" width="820" height="40" fill="#ffffff" opacity="0.85" />
  <text x="58" y="245" font-size="11.5" fill="#41556f">关联（association）</text>
  <text x="300" y="245" font-size="11.5" fill="#41556f">外键（foreign key）</text>
  <text x="560" y="245" font-size="11.5" fill="#41556f">「多」的那一端加外键</text>

  <rect x="40" y="260" width="820" height="40" fill="#ffffff" opacity="0.6" />
  <text x="58" y="285" font-size="11.5" fill="#41556f">聚合 / 组合</text>
  <text x="300" y="285" font-size="11.5" fill="#41556f">外键</text>
  <text x="560" y="285" font-size="11.5" fill="#41556f">数据库里看不出强弱，靠 cascade 表达</text>

  <line x1="40" y1="180" x2="860" y2="180" stroke="#d3e0ee" />
  <line x1="40" y1="220" x2="860" y2="220" stroke="#d3e0ee" />
  <line x1="40" y1="260" x2="860" y2="260" stroke="#d3e0ee" />
  <line x1="40" y1="300" x2="860" y2="300" stroke="#d3e0ee" />
  <line x1="280" y1="104" x2="280" y2="300" stroke="#d3e0ee" />
  <line x1="540" y1="104" x2="540" y2="300" stroke="#d3e0ee" />
  <rect x="40" y="104" width="820" height="196" fill="none" stroke="#c4d4e7" />

  <text x="60" y="338" font-size="14" font-weight="700" fill="#33507f">继承（inheritance）映射的三种方案</text>

  <rect x="40" y="356" width="252" height="216" rx="11" fill="#ffffff" opacity="0.9" stroke="#d3e0ee" />
  <text x="58" y="384" font-size="13.5" font-weight="700" fill="#1f3a63">① 所有类一张表</text>
  <text x="58" y="402" font-size="10.5" fill="#7b8ea8">Single Table</text>
  <line x1="58" y1="414" x2="274" y2="414" stroke="#e3ecf5" />
  <text x="58" y="438" font-size="11" fill="#41556f">父类子类字段全放一张表，</text>
  <text x="58" y="456" font-size="11" fill="#41556f">加一个类型列区分子类。</text>
  <text x="58" y="484" font-size="11" fill="#2c6e49">优点：表少，查询不用连接</text>
  <text x="58" y="510" font-size="11" fill="#8a4b4b">缺点：子类专有字段必须允许空值，</text>
  <text x="58" y="528" font-size="11" fill="#8a4b4b">表会越来越宽，约束难加</text>
  <text x="58" y="556" font-size="10.5" fill="#7b8ea8">子类差异小、字段少时合适</text>

  <rect x="324" y="356" width="252" height="216" rx="11" fill="#ffffff" opacity="0.9" stroke="#d3e0ee" />
  <text x="342" y="384" font-size="13.5" font-weight="700" fill="#1f3a63">② 每个具体类一张表</text>
  <text x="342" y="402" font-size="10.5" fill="#7b8ea8">Concrete Class per Table</text>
  <line x1="342" y1="414" x2="558" y2="414" stroke="#e3ecf5" />
  <text x="342" y="438" font-size="11" fill="#41556f">只给能实例化的类建表，</text>
  <text x="342" y="456" font-size="11" fill="#41556f">父类字段在每张表里重复出现。</text>
  <text x="342" y="484" font-size="11" fill="#2c6e49">优点：查询单个子类最快</text>
  <text x="342" y="510" font-size="11" fill="#8a4b4b">缺点：父类字段重复，改一处</text>
  <text x="342" y="528" font-size="11" fill="#8a4b4b">要改多张表</text>
  <text x="342" y="556" font-size="10.5" fill="#7b8ea8">子类差异大、很少一起查时合适</text>

  <rect x="608" y="356" width="252" height="216" rx="11" fill="#eef5fc" stroke="#7093c8" />
  <text x="626" y="384" font-size="13.5" font-weight="700" fill="#1f3a63">③ 每个类各一张表</text>
  <text x="626" y="402" font-size="10.5" fill="#7b8ea8">Class per Table</text>
  <line x1="626" y1="414" x2="842" y2="414" stroke="#d3e3f2" />
  <text x="626" y="438" font-size="11" fill="#41556f">父类一张表，每个子类再各建</text>
  <text x="626" y="456" font-size="11" fill="#41556f">一张，主键与父类共用。</text>
  <text x="626" y="484" font-size="11" fill="#2c6e49">优点：最贴近面向对象的模型</text>
  <text x="626" y="510" font-size="11" fill="#8a4b4b">缺点：查一个子类要连接多张表，</text>
  <text x="626" y="528" font-size="11" fill="#8a4b4b">层级越深越麻烦</text>
  <text x="626" y="556" font-size="10.5" fill="#7b8ea8">层次固定、要求严格约束时合适</text>

  <text x="450" y="600" text-anchor="middle" font-size="12.5" fill="#33507f">三种方案没有绝对优劣，取决于「子类差异大小」和「平时怎么查」</text>
</svg>
