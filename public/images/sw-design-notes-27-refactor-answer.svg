<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="重构前后的类图对照：左边是重构前，外包工程师继承接单工程师，accept 与 requestParts 两个方法被覆盖成空实现，图上用红色标注子类拒绝接受父类馈赠；右边是重构后，抽出一个只含 id 与 name 的人员类，接单工程师持有一个技能列表并能接单领料，外包工程师持有一个供应商信息、不再继承接单工程师。底部一行文字说明新结构下新增一种工程师类型只需新增一个类"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="rfbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="rfTri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 11 6 L 2 10 z" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.4" />
    </marker>
    <marker id="rfDia" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 7 L 7 3 L 13 7 L 7 11 z" fill="#ffffff" stroke="#9a6a8a" stroke-width="1.3" />
    </marker>
  </defs>

  <rect width="900" height="660" rx="16" fill="url(#rfbg)" />
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">Figure 6: 重构前后的类图对照</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#5a6f8c">左边的问题不是「继承用多了」，而是「继承的语义用错了」</text>

  <!-- 左：重构前 -->
  <rect x="40" y="86" width="400" height="410" rx="10" fill="#ffffff" stroke="#e0b4b4" stroke-width="1.4" />
  <text x="240" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a4b4b">重构前</text>

  <!-- Engineer -->
  <rect x="80" y="132" width="200" height="98" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <line x1="80" y1="156" x2="280" y2="156" stroke="#4b6f9c" stroke-width="1.1" />
  <line x1="80" y1="196" x2="280" y2="196" stroke="#4b6f9c" stroke-width="1.1" />
  <text x="180" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">Engineer</text>
  <text x="88" y="172" font-size="8.5" fill="#41556f"># id : String</text>
  <text x="88" y="188" font-size="8.5" fill="#41556f"># name : String</text>
  <text x="88" y="212" font-size="8.5" fill="#41556f">+ accept(WorkOrder)</text>
  <text x="88" y="226" font-size="8.5" fill="#41556f">+ requestParts(no, qty)</text>

  <!-- OutsourcedEngineer -->
  <rect x="80" y="300" width="240" height="120" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <line x1="80" y1="324" x2="320" y2="324" stroke="#4b6f9c" stroke-width="1.1" />
  <line x1="72" y1="372" x2="318" y2="372" stroke="#4b6f9c" stroke-width="1.1" />
  <text x="200" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">OutsourcedEngineer</text>
  <text x="88" y="342" font-size="8.5" fill="#8a4b4b"># vendorName : String</text>
  <text x="88" y="358" font-size="8.5" fill="#8a4b4b"># vendorContact : String</text>
  <text x="88" y="390" font-size="8.5" fill="#8a4b4b">+ accept()   // Do nothing</text>
  <text x="88" y="406" font-size="8.5" fill="#8a4b4b">+ requestParts()  // return</text>

  <line x1="180" y1="300" x2="180" y2="236" stroke="#4b6f9c" stroke-width="1.5" />
  <path d="M 168 236 L 180 222 L 192 236 z" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.4" />

  <rect x="60" y="436" width="360" height="46" rx="6" fill="#fdf2f2" stroke="#e0b4b4" />
  <text x="72" y="454" font-size="9.5" font-weight="700" fill="#8a4b4b">坏味道：Refused Bequest（被拒绝的馈赠）</text>
  <text x="72" y="472" font-size="9" fill="#8a4b4b">两个方法都被重写成空 —— 子类明确拒绝接受父类给的馈赠</text>

  <!-- 箭头 -->
  <line x1="452" y1="290" x2="496" y2="290" stroke="#7093c8" stroke-width="2" />
  <path d="M 496 283 L 510 290 L 496 297 z" fill="#7093c8" />
  <text x="481" y="278" text-anchor="middle" font-size="9" font-weight="700" fill="#33507f">重构</text>

  <!-- 右：重构后 -->
  <rect x="520" y="86" width="340" height="410" rx="10" fill="#ffffff" stroke="#7fb89f" stroke-width="1.4" />
  <text x="690" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6b58">重构后</text>

  <!-- Person 抽象父类 -->
  <rect x="586" y="132" width="200" height="76" fill="#ffffff" stroke="#2f6b58" stroke-width="1.5" />
  <line x1="586" y1="156" x2="786" y2="156" stroke="#2f6b58" stroke-width="1.1" />
  <line x1="586" y1="188" x2="786" y2="188" stroke="#2f6b58" stroke-width="1.1" />
  <text x="686" y="148" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f3a63">Person «abstract»</text>
  <text x="594" y="172" font-size="8.5" fill="#41556f"># id : String</text>
  <text x="594" y="184" font-size="8.5" fill="#41556f"># name : String</text>

  <!-- Engineer -->
  <rect x="536" y="250" width="160" height="96" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <line x1="536" y1="274" x2="696" y2="274" stroke="#4b6f9c" stroke-width="1.1" />
  <line x1="536" y1="304" x2="696" y2="304" stroke="#4b6f9c" stroke-width="1.1" />
  <text x="616" y="266" text-anchor="middle" font-size="10" font-weight="700" fill="#1f3a63">Engineer</text>
  <text x="544" y="290" font-size="8.5" fill="#41556f">- skills : List&lt;Skill&gt;</text>
  <text x="544" y="320" font-size="8.5" fill="#41556f">+ accept(WorkOrder)</text>
  <text x="544" y="334" font-size="8.5" fill="#41556f">+ requestParts(no, qty)</text>
  <line x1="616" y1="250" x2="616" y2="212" stroke="#2f6b58" stroke-width="1.5" />
  <path d="M 604 212 L 616 198 L 628 212 z" fill="#ffffff" stroke="#2f6b58" stroke-width="1.4" />

  <!-- OutsourcedEngineer -->
  <rect x="712" y="250" width="126" height="96" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <line x1="712" y1="274" x2="838" y2="274" stroke="#4b6f9c" stroke-width="1.1" />
  <line x1="712" y1="304" x2="838" y2="304" stroke="#4b6f9c" stroke-width="1.1" />
  <text x="775" y="264" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f3a63">Outsourced</text>
  <text x="775" y="276" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1f3a63">Engineer</text>
  <text x="720" y="320" font-size="8" fill="#41556f">+ contact()</text>
  <text x="720" y="334" font-size="8" fill="#41556f">+ support()</text>
  <line x1="775" y1="250" x2="775" y2="212" stroke="#2f6b58" stroke-width="1.5" />
  <path d="M 763 212 L 775 198 L 787 212 z" fill="#ffffff" stroke="#2f6b58" stroke-width="1.4" />

  <!-- Vendor 组合：放在 OutsourcedEngineer 右侧外部 -->
  <rect x="712" y="384" width="126" height="44" fill="#ffffff" stroke="#9a6a8a" stroke-width="1.5" />
  <line x1="712" y1="402" x2="838" y2="402" stroke="#9a6a8a" stroke-width="1.1" />
  <text x="775" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#7a4a6a">Vendor</text>
  <text x="720" y="420" font-size="8" fill="#41556f">- name : String</text>
  <line x1="775" y1="384" x2="775" y2="360" stroke="#9a6a8a" stroke-width="1.4" />
  <path d="M 763 372 L 775 360 L 787 372 L 775 384 z" fill="#ffffff" stroke="#9a6a8a" stroke-width="1.3" />
  <text x="792" y="370" font-size="8" font-weight="700" fill="#7a4a6a">组合</text>

  <rect x="536" y="442" width="302" height="42" rx="6" fill="#eef7f3" stroke="#7fb89f" />
  <text x="548" y="458" font-size="9.5" font-weight="700" fill="#2f6b58">改法：Extract Superclass + Replace Inheritance</text>
  <text x="548" y="475" font-size="9" fill="#2f6b58">共同部分（id、name）上移；外包方改用「持有 Vendor」</text>

  <!-- 底部结论 -->
  <rect x="40" y="516" width="820" height="56" rx="8" fill="#fdf7ef" stroke="#d2a074" />
  <text x="56" y="538" font-size="11" font-weight="700" fill="#9a5f2a">收尾那一句话（几乎每次都值一两分）</text>
  <text x="56" y="558" font-size="10.5" fill="#7a4a1e">改后新增「实习工程师」只需新增一个类，不再需要重写任何空方法；改前则必须先继承 Engineer，再覆盖两个自己用不上的方法 —— 这就是「为什么这个改法更好」。</text>

  <text x="40" y="606" font-size="10.5" fill="#8b9bb0">注：空心三角指向父类（Person），不是子类；菱形贴在「整体」那一端（OutsourcedEngineer），不是 Vendor。这两笔是最容易画反的地方。</text>
  <text x="40" y="632" font-size="11" fill="#8a4b4b">判断坏味道只需看一件事：子类有没有把父类的方法重写成空、或直接 return null。有，就是被拒绝的馈赠。</text>
</svg>
