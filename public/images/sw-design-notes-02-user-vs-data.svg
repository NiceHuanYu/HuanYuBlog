<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="用户驱动设计、data-informed design 与数据驱动设计的对比：用户驱动以访谈、问卷、观察为输入，擅长回答为什么和还想要什么，盲点是用户把解决方案当成需求讲、自述与行为不一致；数据驱动以埋点、交易日志、A/B 测试为输入，擅长回答发生了什么和规模多大，盲点是只记录已发生的行为、看不出为什么；data-informed design 同时使用说法与行为两路输入，代价是两条腿都要有人做"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="udbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="580" rx="16" fill="url(#udbg)" />

  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">用户驱动、数据驱动，以及两者的落点</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">两边各自都能走通一半，合起来才够用</text>

  <!-- 左卡：用户驱动 -->
  <rect x="40" y="98" width="252" height="398" rx="12" fill="#ffffff" opacity="0.9" stroke="#d3e0ee" />
  <text x="60" y="132" font-size="17" font-weight="700" fill="#1f3a63">用户驱动设计</text>
  <text x="60" y="152" font-size="11" fill="#7b8ea8">User-Driven Design</text>
  <line x1="60" y1="168" x2="272" y2="168" stroke="#e3ecf5" />
  <text x="60" y="192" font-size="11.5" font-weight="700" fill="#33507f">主要输入</text>
  <text x="60" y="214" font-size="12" fill="#41556f">访谈、问卷、观察</text>
  <text x="60" y="234" font-size="12" fill="#41556f">参与式设计</text>
  <line x1="60" y1="254" x2="272" y2="254" stroke="#e3ecf5" />
  <text x="60" y="278" font-size="11.5" font-weight="700" fill="#33507f">擅长回答</text>
  <text x="60" y="300" font-size="12" fill="#41556f">为什么</text>
  <text x="60" y="320" font-size="12" fill="#41556f">还可能想要什么</text>
  <line x1="60" y1="340" x2="272" y2="340" stroke="#e3ecf5" />
  <text x="60" y="364" font-size="11.5" font-weight="700" fill="#8a4b4b">盲点</text>
  <text x="60" y="386" font-size="12" fill="#5f7183">把解决方案当成需求讲</text>
  <text x="60" y="406" font-size="12" fill="#5f7183">自述与行为不一致</text>
  <text x="60" y="426" font-size="12" fill="#5f7183">描述不出没见过的东西</text>

  <!-- 中卡：data-informed（高亮） -->
  <rect x="324" y="98" width="252" height="398" rx="12" fill="#eef5fc" stroke="#7093c8" stroke-width="2" />
  <text x="344" y="132" font-size="17" font-weight="700" fill="#1f3a63">data-informed</text>
  <text x="344" y="152" font-size="11" fill="#5c7391">数据知情设计</text>
  <line x1="344" y1="168" x2="556" y2="168" stroke="#d3e3f2" />
  <text x="344" y="192" font-size="11.5" font-weight="700" fill="#2c6e49">主要输入</text>
  <text x="344" y="214" font-size="12" fill="#41556f">说法 + 行为，两路都看</text>
  <line x1="344" y1="234" x2="556" y2="234" stroke="#d3e3f2" />
  <text x="344" y="258" font-size="11.5" font-weight="700" fill="#2c6e49">擅长回答</text>
  <text x="344" y="280" font-size="12" fill="#41556f">发生了什么</text>
  <text x="344" y="300" font-size="12" fill="#41556f">以及为什么</text>
  <line x1="344" y1="320" x2="556" y2="320" stroke="#d3e3f2" />
  <text x="344" y="344" font-size="11.5" font-weight="700" fill="#8a4b4b">代价</text>
  <text x="344" y="366" font-size="12" fill="#5f7183">两条腿都要有人做</text>
  <text x="344" y="386" font-size="12" fill="#5f7183">周期更长、成本更高</text>
  <text x="344" y="406" font-size="12" fill="#5f7183">结论分歧时要有人裁决</text>

  <!-- 右卡：数据驱动 -->
  <rect x="608" y="98" width="252" height="398" rx="12" fill="#ffffff" opacity="0.9" stroke="#d3e0ee" />
  <text x="628" y="132" font-size="17" font-weight="700" fill="#1f3a63">数据驱动设计</text>
  <text x="628" y="152" font-size="11" fill="#7b8ea8">Data-Driven Design</text>
  <line x1="628" y1="168" x2="840" y2="168" stroke="#e3ecf5" />
  <text x="628" y="192" font-size="11.5" font-weight="700" fill="#33507f">主要输入</text>
  <text x="628" y="214" font-size="12" fill="#41556f">埋点、交易日志</text>
  <text x="628" y="234" font-size="12" fill="#41556f">A/B 测试</text>
  <line x1="628" y1="254" x2="840" y2="254" stroke="#e3ecf5" />
  <text x="628" y="278" font-size="11.5" font-weight="700" fill="#33507f">擅长回答</text>
  <text x="628" y="300" font-size="12" fill="#41556f">发生了什么</text>
  <text x="628" y="320" font-size="12" fill="#41556f">规模有多大</text>
  <line x1="628" y1="340" x2="840" y2="340" stroke="#e3ecf5" />
  <text x="628" y="364" font-size="11.5" font-weight="700" fill="#8a4b4b">盲点</text>
  <text x="628" y="386" font-size="12" fill="#5f7183">只记录已发生的行为</text>
  <text x="628" y="406" font-size="12" fill="#5f7183">看不出为什么</text>
  <text x="628" y="426" font-size="12" fill="#5f7183">沉默用户没有声音</text>

  <!-- 底部结论 -->
  <rect x="40" y="512" width="820" height="48" rx="10" fill="#ffffff" opacity="0.8" stroke="#d3e0ee" />
  <text x="450" y="542" text-anchor="middle" font-size="13" fill="#33507f">数据告诉你发生了什么，用户告诉你为什么 —— 缺哪一半，都只能猜</text>
</svg>
