<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-label="实体关系图的构成与数据字典：上方是客户、工单、配件消耗、库存项四个实体，以及它们之间的菱形关系标注，分别是报修、包含、引用，并标出一对多与多对一基数；下方是工单表的数据字典四列结构，属性名、类型、长度、定义与业务规则，第四列写得最详细"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="erdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="680" rx="16" fill="url(#erdbg)" />
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">实体关系图 + 数据字典：两张必须一起交的表</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#5a6f8c">菱形上写关系名、线上写基数、字典里写业务规则</text>

  <!-- ERD -->
  <text x="34" y="92" font-size="12.5" font-weight="700" fill="#33507f">① 实体关系图：三个元素齐了才算合格</text>

  <!-- CUSTOMER -->
  <rect x="60" y="112" width="140" height="62" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <text x="130" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">CUSTOMER</text>
  <line x1="60" y1="142" x2="200" y2="142" stroke="#4b6f9c" stroke-width="1" />
  <text x="68" y="158" font-size="8.5" fill="#41556f">customer_id (PK)</text>
  <text x="68" y="170" font-size="8.5" fill="#41556f">name / phone</text>

  <!-- WORK_ORDER -->
  <rect x="330" y="104" width="160" height="78" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <text x="410" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">WORK_ORDER</text>
  <line x1="330" y1="134" x2="490" y2="134" stroke="#4b6f9c" stroke-width="1" />
  <text x="338" y="150" font-size="8.5" fill="#41556f">order_no (PK)</text>
  <text x="338" y="163" font-size="8.5" fill="#41556f">customer_id (FK)</text>
  <text x="338" y="176" font-size="8.5" fill="#41556f">status / created_at</text>

  <!-- PART_USAGE -->
  <rect x="620" y="104" width="160" height="78" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <text x="700" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">PART_USAGE</text>
  <line x1="620" y1="134" x2="780" y2="134" stroke="#4b6f9c" stroke-width="1" />
  <text x="628" y="150" font-size="8.5" fill="#41556f">work_order_id (PK/FK)</text>
  <text x="628" y="163" font-size="8.5" fill="#41556f">part_no (PK/FK)</text>
  <text x="628" y="176" font-size="8.5" fill="#41556f">qty</text>

  <!-- STOCK_ITEM -->
  <rect x="620" y="252" width="160" height="62" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <text x="700" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3a63">STOCK_ITEM</text>
  <line x1="620" y1="282" x2="780" y2="282" stroke="#4b6f9c" stroke-width="1" />
  <text x="628" y="298" font-size="8.5" fill="#41556f">part_no (PK)</text>
  <text x="628" y="310" font-size="8.5" fill="#41556f">on_hand_qty / safe_qty</text>

  <!-- 关系：CUSTOMER 1 - * WORK_ORDER -->
  <line x1="202" y1="143" x2="284" y2="143" stroke="#4b6f9c" stroke-width="1.4" />
  <line x1="284" y1="143" x2="328" y2="143" stroke="#4b6f9c" stroke-width="1.4" />
  <polygon points="284,131 306,143 284,155 262,143" fill="#eef5fc" stroke="#4b6f9c" stroke-width="1.3" />
  <text x="284" y="147" text-anchor="middle" font-size="8.5" font-weight="700" fill="#33507f">报修</text>
  <text x="210" y="136" font-size="8.5" font-weight="700" fill="#8a4b4b">1</text>
  <text x="314" y="136" font-size="8.5" font-weight="700" fill="#8a4b4b">*</text>

  <!-- 关系：WORK_ORDER 1 - * PART_USAGE -->
  <line x1="492" y1="143" x2="566" y2="143" stroke="#4b6f9c" stroke-width="1.4" />
  <line x1="566" y1="143" x2="618" y2="143" stroke="#4b6f9c" stroke-width="1.4" />
  <polygon points="566,131 588,143 566,155 544,143" fill="#fdf7ef" stroke="#c79a6d" stroke-width="1.3" />
  <text x="566" y="147" text-anchor="middle" font-size="8.5" font-weight="700" fill="#9a5f2a">包含</text>
  <text x="498" y="136" font-size="8.5" font-weight="700" fill="#8a4b4b">1</text>
  <text x="604" y="136" font-size="8.5" font-weight="700" fill="#8a4b4b">*</text>

  <!-- 关系：PART_USAGE * - 1 STOCK_ITEM -->
  <line x1="700" y1="184" x2="700" y2="248" stroke="#4b6f9c" stroke-width="1.4" />
  <polygon points="688,206 700,228 712,206 700,184" fill="#eef7f3" stroke="#6fa894" stroke-width="1.3" />
  <text x="700" y="212" text-anchor="middle" font-size="7.5" font-weight="700" fill="#2f6b58">引用</text>
  <text x="706" y="196" font-size="8.5" font-weight="700" fill="#8a4b4b">*</text>
  <text x="706" y="244" font-size="8.5" font-weight="700" fill="#8a4b4b">1</text>

  <!-- 三个元素标注 -->
  <rect x="34" y="200" width="250" height="118" rx="8" fill="#eef5fc" stroke="#7093c8" />
  <text x="48" y="220" font-size="10" font-weight="700" fill="#33507f">三个元素缺一不可</text>
  <text x="48" y="240" font-size="9" fill="#41556f">实体：能唯一标识 + 有多个实例</text>
  <text x="48" y="258" font-size="9" fill="#41556f">关系：菱形 + 写名字（报修/包含/引用）</text>
  <text x="48" y="276" font-size="9" fill="#41556f">基数：线上标 1 与 *，背后是业务规则</text>
  <text x="48" y="298" font-size="8.5" fill="#8a4b4b">不写关系名的图，只是几个框加几根线</text>
  <text x="48" y="312" font-size="8.5" fill="#8b9bb0">读的人要自己猜这层关系是什么</text>

  <!-- 基数带来的表数变化 -->
  <rect x="300" y="200" width="300" height="118" rx="8" fill="#fdf7ef" stroke="#d2a074" />
  <text x="314" y="220" font-size="10" font-weight="700" fill="#9a5f2a">基数决定表的数量</text>
  <text x="314" y="240" font-size="9" fill="#7a4a1e">「一个工程师能属多个片区吗？」</text>
  <text x="322" y="258" font-size="9" fill="#2f6b58">答「能」→ 需要 ENGINEER_DISTRICT 关联表</text>
  <text x="322" y="274" font-size="9" fill="#8a4b4b">答「不能」→ 工程师表加一个外键即可</text>
  <text x="314" y="296" font-size="8.5" fill="#8a4b4b">问一句五分钟，猜错几天迁移</text>
  <text x="314" y="312" font-size="8.5" fill="#8b9bb0">本例答案很可能是「能」（旺季跨片区支援）</text>

  <!-- 数据字典 -->
  <text x="34" y="356" font-size="12.5" font-weight="700" fill="#33507f">② 数据字典：第四列才是它的价值所在</text>

  <rect x="34" y="366" width="832" height="26" fill="#dce8f6" stroke="#b7c7dd" />
  <text x="46" y="383" font-size="9" font-weight="700" fill="#33507f">ATTRIBUTE NAME</text>
  <text x="208" y="383" font-size="9" font-weight="700" fill="#33507f">TYPE</text>
  <text x="290" y="383" font-size="9" font-weight="700" fill="#33507f">LEN</text>
  <text x="360" y="383" font-size="9" font-weight="700" fill="#8a4b4b">DEFINITION AND BUSINESS RULES</text>

  <rect x="34" y="392" width="832" height="30" fill="#ffffff" stroke="#e8eef6" />
  <text x="46" y="411" font-size="8.5" font-family="monospace" fill="#1f3a63">order_no</text>
  <text x="208" y="411" font-size="8.5" fill="#41556f">VARCHAR</text>
  <text x="290" y="411" font-size="8.5" fill="#41556f">20</text>
  <text x="360" y="411" font-size="8.5" fill="#8a4b4b">工单号，格式 WO-yyyyMMdd-nnn；系统生成，不可修改</text>

  <rect x="34" y="422" width="832" height="30" fill="#f6f9fd" stroke="#e8eef6" />
  <text x="46" y="441" font-size="8.5" font-family="monospace" fill="#1f3a63">engineer_id</text>
  <text x="208" y="441" font-size="8.5" fill="#41556f">VARCHAR</text>
  <text x="290" y="441" font-size="8.5" fill="#41556f">10</text>
  <text x="360" y="441" font-size="8.5" font-weight="700" fill="#8a4b4b">派单前为空（0..1）；必须是本片区或在支援名单内</text>

  <rect x="34" y="452" width="832" height="30" fill="#ffffff" stroke="#e8eef6" />
  <text x="46" y="471" font-size="8.5" font-family="monospace" fill="#1f3a63">status</text>
  <text x="208" y="471" font-size="8.5" fill="#41556f">VARCHAR</text>
  <text x="290" y="471" font-size="8.5" fill="#41556f">20</text>
  <text x="360" y="471" font-size="8.5" fill="#8a4b4b">取值见状态机；默认 CREATED；只能按状态机转移</text>

  <rect x="34" y="482" width="832" height="30" fill="#f6f9fd" stroke="#e8eef6" />
  <text x="46" y="501" font-size="8.5" font-family="monospace" fill="#1f3a63">closed_at</text>
  <text x="208" y="501" font-size="8.5" fill="#41556f">DATETIME</text>
  <text x="290" y="501" font-size="8.5" fill="#41556f">——</text>
  <text x="360" y="501" font-size="8.5" fill="#8a4b4b">status = COMPLETED 时必填；不得早于 created_at</text>

  <!-- 状态机 -->
  <rect x="34" y="528" width="470" height="112" rx="8" fill="#ffffff" stroke="#b9c8dd" />
  <text x="48" y="548" font-size="10.5" font-weight="700" fill="#33507f">类别关键字：工单状态机（写清「能从哪转到哪」）</text>
  <text x="48" y="570" font-size="8.5" fill="#41556f">CREATED → ASSIGNED → IN_PROGRESS → COMPLETED</text>
  <text x="48" y="590" font-size="8.5" fill="#8a4b4b">IN_PROGRESS ⇄ PENDING_PARTS（待件挂起可回来）</text>
  <text x="48" y="610" font-size="8.5" fill="#41556f">任意非终态 → CANCELLED（工单只能作废，不能删）</text>
  <text x="48" y="632" font-size="8" fill="#8b9bb0">这张表不只是「有哪些值」，还包括「能转到哪」—— 后面 22 篇的对象行为才有依据</text>

  <rect x="520" y="528" width="346" height="112" rx="8" fill="#eef7f3" stroke="#7fb89f" />
  <text x="534" y="548" font-size="10.5" font-weight="700" fill="#2f6b58">键的选择也得问业务</text>
  <text x="534" y="570" font-size="9" fill="#41556f">客户表用手机号做主键吗？</text>
  <text x="534" y="590" font-size="9" fill="#8a4b4b">不用 —— 手机号会换，换号要改所有外键</text>
  <text x="534" y="610" font-size="9" fill="#2f6b58">用人造编号，换号只改一个字段</text>
  <text x="534" y="632" font-size="8" fill="#8b9bb0">判据：这个标识会不会变？同样是业务问题</text>

  <text x="34" y="664" font-size="10" fill="#8a4b4b">一句话：ERD 说「有哪些东西、怎么连」，数据字典说「每个字段什么意思、有什么约束」。两张表要一起交。</text>
</svg>