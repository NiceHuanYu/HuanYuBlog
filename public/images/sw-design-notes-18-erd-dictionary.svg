<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="实体关系图的构成与数据字典：上方是客户、订单、商品三个实体以及它们之间一对多与多对多的关系标注；下方是数据字典的四列结构，即属性名、类型、长度、定义与业务规则，并给出四行示例"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="erbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="600" rx="16" fill="url(#erbg)" />
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">ERD 与数据字典</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">图形用来对齐理解，字典用来固定细节</text>

  <rect x="60" y="130" width="170" height="90" rx="8" fill="#ffffff" stroke="#7093c8" />
  <rect x="60" y="130" width="170" height="26" fill="#33507f" />
  <text x="145" y="149" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">CUSTOMER</text>
  <text x="76" y="178" font-size="11" fill="#41556f">customer_id [PK]</text>
  <text x="76" y="198" font-size="11" fill="#41556f">customer_name</text>
  <text x="76" y="216" font-size="11" fill="#41556f">contact_no</text>

  <rect x="365" y="130" width="170" height="90" rx="8" fill="#ffffff" stroke="#7093c8" />
  <rect x="365" y="130" width="170" height="26" fill="#33507f" />
  <text x="450" y="149" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">ORDER</text>
  <text x="381" y="178" font-size="11" fill="#41556f">order_id [PK]</text>
  <text x="381" y="198" font-size="11" fill="#41556f">order_date</text>
  <text x="381" y="216" font-size="11" fill="#41556f">customer_id [FK]</text>

  <rect x="670" y="130" width="170" height="90" rx="8" fill="#ffffff" stroke="#7093c8" />
  <rect x="670" y="130" width="170" height="26" fill="#33507f" />
  <text x="755" y="149" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">PRODUCT</text>
  <text x="686" y="178" font-size="11" fill="#41556f">product_id [PK]</text>
  <text x="686" y="198" font-size="11" fill="#41556f">product_name</text>
  <text x="686" y="216" font-size="11" fill="#41556f">unit_price</text>

  <line x1="236" y1="175" x2="359" y2="175" stroke="#7093c8" stroke-width="1.8" />
  <text x="250" y="166" font-size="11" font-weight="700" fill="#33507f">1</text>
  <text x="340" y="166" font-size="11" font-weight="700" fill="#33507f">*</text>
  <line x1="541" y1="175" x2="664" y2="175" stroke="#7093c8" stroke-width="1.8" />
  <text x="555" y="166" font-size="11" font-weight="700" fill="#33507f">*</text>
  <text x="645" y="166" font-size="11" font-weight="700" fill="#33507f">*</text>

  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#5a6f8c">一个客户可以有多张订单（1 对多）；一张订单可以包含多个商品（多对多）</text>
  <text x="450" y="274" text-anchor="middle" font-size="12" fill="#8a4b4b">多对多关系在关系模型里通常要拆出一个中间实体，比如 ORDER_ITEM</text>

  <rect x="40" y="304" width="820" height="38" fill="#33507f" />
  <text x="58" y="330" font-size="12.5" font-weight="700" fill="#ffffff">ATTRIBUTE NAME</text>
  <text x="310" y="330" font-size="12.5" font-weight="700" fill="#ffffff">TYPE</text>
  <text x="400" y="330" font-size="12.5" font-weight="700" fill="#ffffff">LEN</text>
  <text x="480" y="330" font-size="12.5" font-weight="700" fill="#ffffff">DEFINITION AND BUSINESS RULES</text>

  <rect x="40" y="342" width="820" height="42" fill="#ffffff" opacity="0.85" />
  <text x="58" y="368" font-size="11.5" fill="#41556f">customer_id</text>
  <text x="310" y="368" font-size="11.5" fill="#41556f">CHAR</text>
  <text x="400" y="368" font-size="11.5" fill="#41556f">8</text>
  <text x="480" y="368" font-size="11.5" fill="#41556f">客户唯一编号，由系统自动生成，不可修改</text>

  <rect x="40" y="384" width="820" height="42" fill="#ffffff" opacity="0.6" />
  <text x="58" y="410" font-size="11.5" fill="#41556f">customer_name</text>
  <text x="310" y="410" font-size="11.5" fill="#41556f">VARCHAR</text>
  <text x="400" y="410" font-size="11.5" fill="#41556f">60</text>
  <text x="480" y="410" font-size="11.5" fill="#41556f">客户姓名，必填</text>

  <rect x="40" y="426" width="820" height="42" fill="#ffffff" opacity="0.85" />
  <text x="58" y="452" font-size="11.5" fill="#41556f">contact_no</text>
  <text x="310" y="452" font-size="11.5" fill="#41556f">VARCHAR</text>
  <text x="400" y="452" font-size="11.5" fill="#41556f">20</text>
  <text x="480" y="452" font-size="11.5" fill="#41556f">联系电话，仅允许 8–20 位数字</text>

  <rect x="40" y="468" width="820" height="42" fill="#ffffff" opacity="0.6" />
  <text x="58" y="494" font-size="11.5" fill="#41556f">join_date</text>
  <text x="310" y="494" font-size="11.5" fill="#41556f">DATE</text>
  <text x="400" y="494" font-size="11.5" fill="#41556f">—</text>
  <text x="480" y="494" font-size="11.5" fill="#41556f">入会日期，不得晚于当前日期</text>

  <line x1="40" y1="384" x2="860" y2="384" stroke="#d3e0ee" />
  <line x1="40" y1="426" x2="860" y2="426" stroke="#d3e0ee" />
  <line x1="40" y1="468" x2="860" y2="468" stroke="#d3e0ee" />
  <line x1="300" y1="304" x2="300" y2="510" stroke="#d3e0ee" />
  <line x1="390" y1="304" x2="390" y2="510" stroke="#d3e0ee" />
  <line x1="470" y1="304" x2="470" y2="510" stroke="#d3e0ee" />
  <rect x="40" y="304" width="820" height="206" fill="none" stroke="#c4d4e7" />

  <text x="450" y="542" text-anchor="middle" font-size="12" fill="#33507f">命名规则全项目统一：实体用单数名词，属性名带上实体前缀（customer_name）</text>
  <text x="450" y="568" text-anchor="middle" font-size="12" fill="#8a4b4b">「定义与业务规则」这一列最容易被空着，而它恰恰是开发最需要的地方</text>
</svg>
