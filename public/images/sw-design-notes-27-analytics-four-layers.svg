<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="数据驱动分析的四层递进图：从下往上依次是描述性、诊断性、预测性、处方性四层。每层标出它回答的问题、需要的数据、分析手段，以及对业务的作用。右侧用一条阶梯表示分析难度与价值递增，并标出最常失分的地方是处方性必须落到具体动作"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="anbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="anArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5743a" />
    </marker>
  </defs>

  <rect width="900" height="660" rx="16" fill="url(#anbg)" />
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">四层分析：每层的「问题」和「动作」都不一样</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#5a6f8c">考试只考一件事：你能不能把一句抱怨，逐层翻成「要什么数据、为什么、该做什么」</text>

  <!-- 已画好的四层，从下往上 -->
  <!-- 处方性 -->
  <rect x="40" y="92" width="600" height="120" rx="10" fill="#fdf2f2" stroke="#e0b4b4" stroke-width="1.5" />
  <text x="58" y="116" font-size="13" font-weight="700" fill="#8a4b4b">④ Prescriptive 处方性 —— 该做什么</text>
  <text x="58" y="140" font-size="10.5" fill="#41556f">问题：怎么保证该动作的事一定发生？</text>
  <text x="58" y="160" font-size="10.5" fill="#41556f">数据：预测结果 + 当前库存 + 供应商可售量</text>
  <text x="58" y="180" font-size="10.5" fill="#41556f">手段：阈值比对 + 自动生成建议 + 推送</text>
  <rect x="330" y="148" width="296" height="52" rx="6" fill="#ffffff" stroke="#e0b4b4" />
  <text x="342" y="166" font-size="9.5" font-weight="700" fill="#8a4b4b">本例的成品答案</text>
  <text x="342" y="184" font-size="9" fill="#8a4b4b">低于安全库存 → 生成补货建议 → 推送仓管</text>
  <text x="58" y="200" font-size="9.5" fill="#8b9bb0">← 这一层必须落到「系统替人做的建议或提醒」，否则与前一层没区别</text>

  <!-- 预测性 -->
  <rect x="40" y="226" width="600" height="108" rx="10" fill="#fdf7ef" stroke="#d2a074" stroke-width="1.5" />
  <text x="58" y="250" font-size="13" font-weight="700" fill="#9a5f2a">③ Predictive 预测性 —— 可能发生什么</text>
  <text x="58" y="274" font-size="10.5" fill="#41556f">问题：接下来哪些配件会缺？缺在哪个片区？</text>
  <text x="58" y="294" font-size="10.5" fill="#41556f">数据：历史消耗 + 季节性 + 供应商交期</text>
  <text x="350" y="274" font-size="9.5" fill="#8a5c30">← 只给「概率/趋势」，不给动作</text>
  <text x="58" y="316" font-size="10.5" fill="#41556f">手段：按配件 × 片区的时序预测，给出未来 2 周需求量</text>

  <!-- 诊断性 -->
  <rect x="40" y="348" width="600" height="108" rx="10" fill="#eef5fc" stroke="#7093c8" stroke-width="1.5" />
  <text x="58" y="372" font-size="13" font-weight="700" fill="#33507f">② Diagnostic 诊断性 —— 为什么发生</text>
  <text x="58" y="396" font-size="10.5" fill="#41556f">问题：缺货是否集中在某几类故障？还是领料习惯？</text>
  <text x="58" y="416" font-size="10.5" fill="#41556f">数据：缺货记录 + 当时库存快照 + 工单故障类型</text>
  <text x="58" y="438" font-size="10.5" fill="#41556f">手段：交叉分析，找出相关性</text>

  <!-- 描述性 -->
  <rect x="40" y="470" width="600" height="108" rx="10" fill="#eef7f3" stroke="#6fa894" stroke-width="1.5" />
  <text x="58" y="494" font-size="13" font-weight="700" fill="#2f6b58">① Descriptive 描述性 —— 发生了什么</text>
  <text x="58" y="518" font-size="10.5" fill="#41556f">问题：哪些配件经常缺？缺在哪个片区？缺了多少次？</text>
  <text x="58" y="538" font-size="10.5" fill="#41556f">数据：近 12 个月每张工单的配件消耗记录、每次被拒的缺货记录</text>
  <text x="58" y="560" font-size="10.5" fill="#41556f">手段：按配件 × 片区汇总出库量，统计缺货次数</text>

  <!-- 右侧阶梯 -->
  <path d="M 668 578 L 700 578 L 700 500 L 732 500 L 732 422 L 764 422 L 764 344 L 796 344 L 796 266 L 828 266 L 828 188" fill="none" stroke="#b5743a" stroke-width="2.2" />
  <line x1="828" y1="200" x2="828" y2="182" stroke="#b5743a" stroke-width="2.2" marker-end="url(#anArrow)" />
  <text x="700" y="600" font-size="9.5" fill="#b5743a">越往上</text>
  <text x="700" y="616" font-size="9.5" fill="#b5743a">难度越大</text>
  <text x="700" y="632" font-size="9.5" fill="#b5743a">价值也越大</text>
  <text x="840" y="200" font-size="9" fill="#b5743a">高</text>
  <text x="840" y="580" font-size="9" fill="#b5743a">低</text>

  <!-- 右侧提示 -->
  <rect x="668" y="92" width="200" height="86" rx="8" fill="#ffffff" stroke="#d3deea" />
  <text x="680" y="112" font-size="10.5" font-weight="700" fill="#33507f">答题时最容易丢分</text>
  <text x="680" y="132" font-size="9.5" fill="#8a4b4b">四层写成同一件事的</text>
  <text x="680" y="146" font-size="9.5" fill="#8a4b4b">四种说法</text>
  <text x="680" y="164" font-size="9.5" fill="#41556f">区别在：有没有落到动作</text>

  <!-- 底部 -->
  <text x="40" y="600" font-size="11" fill="#8a4b4b">一句口诀：描述「看清」→ 诊断「找因」→ 预测「猜下一步」→ 处方「替人做决定」。</text>
  <text x="40" y="626" font-size="10.5" fill="#8b9bb0">表格里「需要的数据 / 分析手段 / 业务目标」三列，每一格都要写到本例的业务名词上，不能写「用 AI 分析」这类空话。</text>
</svg>
