<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="从需求到设计的主干链路：第一阶段需求与分析包含事实调查、范围界定、用户故事、用例建模、实体与工作流、前端设计、非功能需求、测试八个环节；第二阶段设计与结构包含数据库分析、规范化、逻辑数据模型、面向对象、UML、分析建模、设计建模、设计原则、重构九个环节。每个环节框内都标出对应笔记编号，便于定位到具体篇目"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="mpbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7093c8" />
    </marker>
  </defs>

  <rect width="900" height="600" rx="16" fill="url(#mpbg)" />
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">从需求到设计的主干链路</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#5a6f8c">前一轮的输出就是后一轮的输入；框内的数字是对应笔记编号</text>

  <!-- 第一阶段 -->
  <rect x="34" y="84" width="832" height="196" rx="10" fill="#ffffff" stroke="#b9c8dd" />
  <text x="50" y="106" font-size="12.5" font-weight="700" fill="#33507f">第一阶段 · 需求与分析</text>
  <text x="240" y="106" font-size="10" fill="#8b9bb0">把「要做什么」变成可验证、可确认的模型</text>
  <text x="850" y="106" text-anchor="end" font-size="9.5" fill="#8a4b4b">验收：用户 / 业务方能不能看懂并确认</text>

