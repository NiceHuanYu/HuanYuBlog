  <text x="352" y="240" text-anchor="middle" font-size="8" font-weight="700" fill="#b5743a">笔记 12</text>

  <rect x="462" y="190" width="192" height="56" rx="7" fill="#ffffff" stroke="#7093c8" />
  <text x="558" y="212" text-anchor="middle" font-size="11.5" font-weight="700" fill="#33507f">非功能需求</text>
  <text x="558" y="228" text-anchor="middle" font-size="8.5" fill="#5a6f8c">Non-Functional Req</text>
  <text x="558" y="240" text-anchor="middle" font-size="8" font-weight="700" fill="#b5743a">笔记 15</text>

  <rect x="668" y="190" width="184" height="56" rx="7" fill="#ffffff" stroke="#7093c8" />
