  <text x="124" y="466" text-anchor="middle" font-size="8.5" fill="#5a6f8c">Analysis Modelling</text>
  <text x="124" y="478" text-anchor="middle" font-size="8" font-weight="700" fill="#b5743a">笔记 22</text>

