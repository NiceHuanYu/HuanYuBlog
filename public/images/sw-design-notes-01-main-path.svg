  <text x="50" y="568" font-size="9.5" fill="#7a4a1e">笔记 27 拿一份完整案例把整份卷子从头走到尾　｜　笔记 28 讲每个 UML 符号在 draw.io 里怎么落笔</text>
  <text x="620" y="568" font-size="9" fill="#8a4b4b">这两篇把「会什么」直接转成「能拿多少分」</text>
</svg>