<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="用例图的构成与用例描述的要素：系统边界框内是查询航班、预订、取消订单三个用例，左侧参与者是旅客，右侧参与者是客服；下方列出用例描述必须写清的四件事：参与者、前置条件、主流程、例外流程"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="ucbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#ucbg)" />
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a63">用例图与用例描述</text>
  <text x="450" y="70" text-anchor="middle" font-size="13.5" fill="#5a6f8c">用例图说清边界与交互，用例描述说清流程</text>

  <!-- 系统边界 -->
  <rect x="270" y="140" width="360" height="280" rx="12" fill="#ffffff" opacity="0.75" stroke="#c4d4e7" stroke-dasharray="6 4" />
  <text x="450" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#33507f">系统边界（System Boundary）</text>

  <ellipse cx="450" cy="232" rx="100" ry="32" fill="#eef5fc" stroke="#7093c8" />
  <text x="450" y="237" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f3a63">查询航班</text>

  <ellipse cx="450" cy="300" rx="100" ry="32" fill="#eef5fc" stroke="#7093c8" />
  <text x="450" y="305" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f3a63">预订</text>

  <ellipse cx="450" cy="368" rx="100" ry="32" fill="#eef5fc" stroke="#7093c8" />
  <text x="450" y="373" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f3a63">取消订单</text>

  <!-- 左参与者：旅客 -->
  <circle cx="140" cy="262" r="11" fill="#ffffff" stroke="#33507f" stroke-width="2" />
  <line x1="140" y1="273" x2="140" y2="307" stroke="#33507f" stroke-width="2" />
  <line x1="116" y1="290" x2="164" y2="290" stroke="#33507f" stroke-width="2" />
  <line x1="140" y1="307" x2="122" y2="332" stroke="#33507f" stroke-width="2" />
  <line x1="140" y1="307" x2="158" y2="332" stroke="#33507f" stroke-width="2" />
  <text x="140" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a63">旅客</text>
  <text x="140" y="373" text-anchor="middle" font-size="10.5" fill="#7b8ea8">Traveller</text>
  <line x1="164" y1="288" x2="346" y2="228" stroke="#7093c8" stroke-width="1.6" />
  <line x1="164" y1="292" x2="346" y2="298" stroke="#7093c8" stroke-width="1.6" />

  <!-- 右参与者：客服 -->
  <circle cx="760" cy="262" r="11" fill="#ffffff" stroke="#33507f" stroke-width="2" />
  <line x1="760" y1="273" x2="760" y2="307" stroke="#33507f" stroke-width="2" />
  <line x1="736" y1="290" x2="784" y2="290" stroke="#33507f" stroke-width="2" />
  <line x1="760" y1="307" x2="742" y2="332" stroke="#33507f" stroke-width="2" />
  <line x1="760" y1="307" x2="778" y2="332" stroke="#33507f" stroke-width="2" />
  <text x="760" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#1f3a63">客服</text>
  <text x="760" y="373" text-anchor="middle" font-size="10.5" fill="#7b8ea8">Agent</text>
  <line x1="736" y1="288" x2="554" y2="304" stroke="#7093c8" stroke-width="1.6" />
  <line x1="736" y1="296" x2="554" y2="362" stroke="#7093c8" stroke-width="1.6" />

  <!-- 用例描述要素 -->
  <text x="60" y="480" font-size="14" font-weight="700" fill="#33507f">一个用例描述里必须写清的四件事</text>
  <text x="60" y="512" font-size="12" fill="#41556f">· 参与者（actor）是谁</text>
  <text x="470" y="512" font-size="12" fill="#41556f">· 前置条件（precondition）</text>
  <text x="60" y="540" font-size="12" fill="#41556f">· 主流程（basic flow）</text>
  <text x="470" y="540" font-size="12" fill="#41556f">· 例外流程（alternative flow）</text>
  <text x="60" y="578" font-size="12" fill="#8a4b4b">用例图只说明「谁和系统之间有哪些交互」，流程细节要靠在用例描述与活动图里补。</text>
</svg>
