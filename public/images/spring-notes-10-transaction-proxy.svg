<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Service 层的事务边界由 Spring 代理开启与提交；Spring Bean 内部自调用绕开代理，因此 @Transactional 不生效"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="txbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="txarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7093c8" />
    </marker>
    <marker id="txarrowbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b4636b" />
    </marker>
  </defs>

  <rect width="900" height="560" rx="16" fill="url(#txbg)" />
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1f3a63">事务边界由代理开启：调用必须「从外面」进来</text>

  <!-- 第一行：调用链 -->
  <rect x="40" y="60" width="190" height="62" rx="10" fill="#ffffff" stroke="#c4d4e7" />
  <text x="135" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1f3a63">Controller</text>
  <text x="135" y="107" text-anchor="middle" font-size="13" fill="#5a6f8c">这里没有事务边界</text>

  <line x1="230" y1="91" x2="336" y2="91" stroke="#7093c8" stroke-width="2" marker-end="url(#txarrow)" />
  <text x="283" y="80" text-anchor="middle" font-size="12" fill="#5a6f8c">调用</text>

  <rect x="344" y="60" width="210" height="62" rx="10" fill="#33507f" />
  <text x="449" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Spring 代理</text>
  <text x="449" y="107" text-anchor="middle" font-size="13" fill="#dbe5f1">读 @Transactional 决定开不开事务</text>

  <line x1="554" y1="91" x2="656" y2="91" stroke="#7093c8" stroke-width="2" marker-end="url(#txarrow)" />
  <text x="605" y="80" text-anchor="middle" font-size="12" fill="#5a6f8c">转发</text>

  <rect x="664" y="60" width="196" height="62" rx="10" fill="#ffffff" stroke="#c4d4e7" />
  <text x="762" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1f3a63">Service 方法</text>
  <text x="762" y="107" text-anchor="middle" font-size="13" fill="#5a6f8c">业务代码与 Repository 调用</text>

  <!-- 事务边界 -->
  <rect x="344" y="140" width="516" height="86" rx="10" fill="#ffffff" stroke="#7093c8" stroke-width="2" stroke-dasharray="6 5" />
  <text x="602" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#33507f">事务边界：BEGIN … COMMIT / ROLLBACK</text>
  <text x="602" y="191" text-anchor="middle" font-size="13" fill="#5a6f8c">代理在方法进入前开启事务，方法正常返回就提交</text>
  <text x="602" y="212" text-anchor="middle" font-size="13" fill="#5a6f8c">方法里所有 Repository 调用自动加入同一个事务</text>

  <!-- 自调用对比 -->
  <text x="60" y="266" font-size="15" font-weight="600" fill="#1f3a63">同一个方法，两种调用方式的差别</text>

  <rect x="60" y="284" width="780" height="76" rx="10" fill="#ffffff" stroke="#c4d4e7" />
  <text x="82" y="312" font-size="14" font-weight="600" fill="#2f6b4f">✓ 外部调用</text>
  <text x="82" y="338" font-size="13" fill="#5a6f8c">其他 Bean 拿到的是代理，调用 transfer() 时先进入代理再进入方法，事务正常开启</text>
  <text x="470" y="312" font-size="13" fill="#1f3a63">调用方 → 代理 → transfer()</text>

  <rect x="60" y="378" width="780" height="76" rx="10" fill="#ffffff" stroke="#c4d4e7" />
  <text x="82" y="406" font-size="14" font-weight="600" fill="#b4636b">✗ 自调用</text>
  <text x="82" y="432" font-size="13" fill="#5a6f8c">transfer() 里直接 this.helper()，走的是原始对象，不经过代理，helper 上的 @Transactional 不生效</text>
  <line x1="470" y1="416" x2="620" y2="416" stroke="#b4636b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#txarrowbad)" />
  <text x="625" y="406" font-size="13" fill="#b4636b">绕开代理</text>

  <text x="450" y="492" text-anchor="middle" font-size="13" fill="#7c8ca3">事务方法必须是 public，且从代理外部调用：拆到另一个 Bean、或把事务方法本身作为入口</text>
  <text x="450" y="518" text-anchor="middle" font-size="13" fill="#7c8ca3">传播行为（REQUIRED、REQUIRES_NEW 等）决定的是「内部方法要不要用同一个事务」，见正文表格</text>
</svg>
