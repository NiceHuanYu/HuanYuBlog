<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="类图与顺序图符号特写：左列是类符号的三格结构（类名、带可见性的属性列表、带返回类型的操作列表），以及依赖、关联、聚合、组合、继承五种关系的连线样式，并标出菱形贴在整体一端、空心三角指向父类；右列是顺序图的三要素，即生命线、消息与激活条，并给出 Actor、Boundary、Control、Entity 四条生命线的推荐排列顺序"
     font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="sym21bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafd" />
      <stop offset="1" stop-color="#e9eff8" />
    </linearGradient>
    <marker id="open21" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#4b6f9c" stroke-width="1.4" />
    </marker>
    <marker id="solid21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6f9c" />
    </marker>
  </defs>

  <rect width="900" height="800" rx="16" fill="url(#sym21bg)" />
  <text x="450" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1f3a63">类图与顺序图：三格怎么写，五种关系怎么连</text>
  <text x="450" y="66" text-anchor="middle" font-size="12.5" fill="#5a6f8c">聚合、组合、继承这三种符号不在形状库里，要改连线的端点样式才能画出来</text>

  <!-- ================= 左列：类图 ================= -->
  <rect x="30" y="86" width="410" height="614" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="48" y="112" font-size="14" font-weight="700" fill="#33507f">类图 · 三格与五种关系</text>

  <!-- 类符号 -->
  <rect x="56" y="124" width="215" height="160" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.5" />
  <line x1="56" y1="154" x2="271" y2="154" stroke="#4b6f9c" stroke-width="1.2" />
  <line x1="56" y1="220" x2="271" y2="220" stroke="#4b6f9c" stroke-width="1.2" />
  <text x="163" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3a63">WorkOrder</text>
  <text x="64" y="172" font-size="9" fill="#41556f">- id : String</text>
  <text x="64" y="190" font-size="9" fill="#41556f">- status : WorkOrderStatus</text>
  <text x="64" y="208" font-size="9" fill="#41556f">- createdAt : Date</text>
  <text x="64" y="240" font-size="9" fill="#41556f">+ assign(engineerId : String) : void</text>
  <text x="64" y="262" font-size="9" fill="#41556f">+ close() : void</text>

  <text x="286" y="142" font-size="11" font-weight="700" fill="#33507f">① 类名</text>
  <text x="286" y="160" font-size="9.5" fill="#41556f">用业务术语，不加 Table/DTO</text>
  <text x="286" y="186" font-size="11" font-weight="700" fill="#33507f">② 属性列表</text>
  <text x="286" y="203" font-size="9.5" fill="#41556f">visibility name : type</text>
  <text x="286" y="218" font-size="9.5" fill="#8a4b4b">- 私有　# 受保护　+ 公开</text>
  <text x="286" y="248" font-size="11" font-weight="700" fill="#33507f">③ 操作列表</text>
  <text x="286" y="265" font-size="9.5" fill="#41556f">name(param : type) : type</text>

  <line x1="48" y1="302" x2="422" y2="302" stroke="#dbe4ef" stroke-width="1.2" />

  <!-- 五种关系 -->
  <text x="48" y="324" font-size="12.5" font-weight="700" fill="#33507f">五种关系：符号 + draw.io 怎么调出来</text>

  <!-- dependency -->
  <line x1="58" y1="354" x2="146" y2="354" stroke="#4b6f9c" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open21)" />
  <text x="160" y="352" font-size="10.5" font-weight="700" fill="#1f3a63">依赖 dependency</text>
  <text x="160" y="369" font-size="9.5" fill="#41556f">虚线 + 开放箭头；出现在参数或局部变量里</text>

  <!-- association -->
  <line x1="58" y1="406" x2="146" y2="406" stroke="#4b6f9c" stroke-width="1.4" />
  <text x="150" y="400" font-size="8.5" fill="#41556f">1</text>
  <text x="140" y="420" font-size="8.5" fill="#41556f">*</text>
  <text x="160" y="404" font-size="10.5" font-weight="700" fill="#1f3a63">关联 association</text>
  <text x="160" y="421" font-size="9.5" fill="#41556f">实线，可标重数；长期持有引用</text>

  <!-- aggregation -->
  <line x1="82" y1="458" x2="146" y2="458" stroke="#4b6f9c" stroke-width="1.4" />
  <path d="M 58 458 L 70 450 L 82 458 L 70 466 z" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.4" />
  <text x="160" y="456" font-size="10.5" font-weight="700" fill="#1f3a63">聚合 aggregation</text>
  <text x="160" y="473" font-size="9.5" fill="#8a4b4b">空心菱形，贴「整体」那一端</text>

  <!-- composition -->
  <line x1="82" y1="510" x2="146" y2="510" stroke="#4b6f9c" stroke-width="1.4" />
  <path d="M 58 510 L 70 502 L 82 510 L 70 518 z" fill="#4b6f9c" stroke="#4b6f9c" stroke-width="1.4" />
  <text x="160" y="508" font-size="10.5" font-weight="700" fill="#1f3a63">组合 composition</text>
  <text x="160" y="525" font-size="9.5" fill="#41556f">实心菱形；部分随整体消亡</text>

  <!-- inheritance -->
  <line x1="58" y1="562" x2="132" y2="562" stroke="#4b6f9c" stroke-width="1.4" />
  <path d="M 132 552 L 148 562 L 132 572 z" fill="#ffffff" stroke="#4b6f9c" stroke-width="1.4" />
  <text x="160" y="560" font-size="10.5" font-weight="700" fill="#1f3a63">继承 inheritance</text>
  <text x="160" y="577" font-size="9.5" fill="#8a4b4b">空心三角必须指向父类</text>

  <!-- 提示 -->
  <rect x="48" y="596" width="374" height="88" rx="8" fill="#fdf7ef" stroke="#d2a074" />
  <text x="60" y="616" font-size="10.5" font-weight="700" fill="#9a5f2a">后三种怎么画（最容易卡住的地方）</text>
  <text x="60" y="636" font-size="9.5" fill="#7a4a1e">先连普通实线 → 选中线 → 右侧格式面板 Line：</text>
  <text x="60" y="652" font-size="9.5" fill="#7a4a1e">三角形选 block/open arrow 并设 filled = 0</text>
  <text x="60" y="668" font-size="9.5" fill="#7a4a1e">菱形选 diamond，空心 filled = 0、实心 = 1</text>
  <text x="60" y="680" font-size="9" fill="#8a5c30">记不住菜单就直接 Edit Style 打：endArrow=block;endFill=0;</text>

  <!-- ================= 右列：顺序图 ================= -->
  <rect x="460" y="86" width="410" height="614" rx="12" fill="#ffffff" stroke="#b9c8dd" />
  <text x="478" y="112" font-size="14" font-weight="700" fill="#33507f">顺序图 · 三要素与生命线顺序</text>

  <!-- 生命线头 -->
  <rect x="470" y="128" width="78" height="22" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="509" y="143" text-anchor="middle" font-size="8" fill="#1f3a63">:Customer</text>
  <rect x="562" y="128" width="78" height="22" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="601" y="143" text-anchor="middle" font-size="8" fill="#1f3a63">:DispatchForm</text>
  <rect x="654" y="128" width="78" height="22" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="693" y="143" text-anchor="middle" font-size="8" fill="#1f3a63">:DispatchCtrl</text>
  <rect x="746" y="128" width="78" height="22" rx="3" fill="#fdf7ef" stroke="#c79a6d" />
  <text x="785" y="143" text-anchor="middle" font-size="8" fill="#7a4a1e">:Engineer</text>

  <!-- 生命线 -->
  <line x1="509" y1="150" x2="509" y2="296" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="601" y1="150" x2="601" y2="296" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="693" y1="150" x2="693" y2="296" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />
  <line x1="785" y1="150" x2="785" y2="296" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="4 3" />

  <!-- 激活条 -->
  <rect x="597" y="172" width="8" height="96" fill="#dce8f6" stroke="#7093c8" stroke-width="0.9" />
  <rect x="689" y="196" width="8" height="72" fill="#dce8f6" stroke="#7093c8" stroke-width="0.9" />
  <rect x="781" y="220" width="8" height="16" fill="#f7e6d2" stroke="#c79a6d" stroke-width="0.9" />

  <!-- 消息 -->
  <line x1="511" y1="176" x2="596" y2="176" stroke="#4b6f9c" stroke-width="1.4" marker-end="url(#solid21)" />
  <text x="553" y="171" text-anchor="middle" font-size="7.5" fill="#41556f">1: submit()</text>
  <line x1="606" y1="200" x2="688" y2="200" stroke="#4b6f9c" stroke-width="1.4" marker-end="url(#solid21)" />
  <text x="647" y="195" text-anchor="middle" font-size="7.5" fill="#41556f">2: dispatch()</text>
  <line x1="698" y1="224" x2="780" y2="224" stroke="#4b6f9c" stroke-width="1.4" marker-end="url(#solid21)" />
  <text x="739" y="219" text-anchor="middle" font-size="7.5" fill="#41556f">3: getSchedule()</text>
  <line x1="780" y1="240" x2="699" y2="240" stroke="#9a6a8a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#open21)" />
  <text x="739" y="254" text-anchor="middle" font-size="7.5" fill="#8a5c7a">return</text>

  <!-- 三要素标注 -->
  <text x="470" y="322" font-size="11" font-weight="700" fill="#33507f">① 生命线 lifeline</text>
  <text x="470" y="338" font-size="9.5" fill="#41556f">每个参与对象一条竖虚线，顶部写 :类名</text>
  <text x="470" y="362" font-size="11" font-weight="700" fill="#33507f">② 消息 message</text>
  <text x="470" y="378" font-size="9.5" fill="#41556f">实线 + 实心箭头，横向，箭头方向就是调用方向</text>
  <text x="470" y="394" font-size="9.5" fill="#8a5c7a">返回用虚线 + 开放箭头</text>
  <text x="470" y="418" font-size="11" font-weight="700" fill="#33507f">③ 激活条 activation</text>
  <text x="470" y="434" font-size="9.5" fill="#41556f">生命线上的细长矩形，表示这段在处理</text>

  <line x1="470" y1="452" x2="860" y2="452" stroke="#dbe4ef" stroke-width="1.2" />

  <!-- 生命线顺序 -->
  <text x="470" y="474" font-size="12" font-weight="700" fill="#33507f">生命线的推荐顺序</text>
  <rect x="470" y="484" width="90" height="24" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="515" y="500" text-anchor="middle" font-size="8.5" fill="#1f3a63">: Actor</text>
  <rect x="566" y="484" width="90" height="24" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="611" y="500" text-anchor="middle" font-size="8.5" fill="#1f3a63">: Boundary</text>
  <rect x="662" y="484" width="90" height="24" rx="3" fill="#eef5fc" stroke="#7093c8" />
  <text x="707" y="500" text-anchor="middle" font-size="8.5" fill="#1f3a63">: Control</text>
  <rect x="758" y="484" width="90" height="24" rx="3" fill="#fdf7ef" stroke="#c79a6d" />
  <text x="803" y="500" text-anchor="middle" font-size="8.5" fill="#7a4a1e">: Entity</text>
  <text x="470" y="526" font-size="9.5" fill="#41556f">按这个顺序摆，消息箭头大部分从左指向右，交叉线最少。</text>

  <rect x="470" y="542" width="378" height="86" rx="8" fill="#eef5fc" stroke="#7093c8" />
  <text x="482" y="562" font-size="10.5" font-weight="700" fill="#33507f">draw.io 操作要点</text>
  <text x="482" y="581" font-size="9.5" fill="#41556f">搜 sequence 拖出预置生命线（自带虚线 + 激活条）</text>
  <text x="482" y="597" font-size="9.5" fill="#41556f">改名双击顶部矩形；加消息拖边缘小箭头再双击连线</text>
  <text x="482" y="613" font-size="9.5" fill="#41556f">返回改虚线：选中消息 → Line → dashed</text>

  <text x="30" y="726" font-size="10.5" fill="#8b9bb0">注：draw.io 各版本菜单文字略有差异，端点样式的属性名 endArrow / endFill 相对稳定，优先记属性。</text>
  <text x="30" y="752" font-size="11" fill="#8a4b4b">这份案例里没有继承关系 —— 那本身就是个结论。硬找 is-a 去套继承，很容易造出「被拒绝的馈赠」（笔记 25）。</text>
</svg>
